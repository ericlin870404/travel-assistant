<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅遊助手 - 總覽</title>
    <link rel="manifest" href="manifest.json?v=0318">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { background: #f1f5f9; font-family: 'Inter', 'Noto Sans TC', sans-serif; }

        .welcome-screen {
            position: fixed; inset: 0; background: #0f172a;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loader-svg { transform: rotate(-90deg); }
        .loader-circle {
            fill: none; stroke: #fbbf24; stroke-width: 4; stroke-linecap: round;
            stroke-dasharray: 345; stroke-dashoffset: 345;
            animation: progress 1.5s ease-in-out forwards;
        }
        @keyframes progress { to { stroke-dashoffset: 0; } }
        .welcome-text {
            position: absolute; color: white; font-weight: bold;
            opacity: 0; transform: translateY(10px);
            animation: textFadeUp 0.8s ease-out 0.3s forwards;
        }
        @keyframes textFadeUp { to { opacity: 1; transform: translateY(0); } }
        .welcome-fade-out { opacity: 0; transform: scale(1.1); pointer-events: none; }

        .accordion-content {
            max-height: 0; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }
        .accordion-item.active .accordion-content {
            max-height: 1000px; opacity: 1; margin-top: 1.5rem;
        }
        .chevron-icon { transition: transform 0.4s; }
        .accordion-item.active .chevron-icon { transform: rotate(180deg); }

        .card-history { border-left: 6px solid #64748b; }
        .card-ongoing { border-left: 6px solid #0891b2; }
        .card-shared  { border-left: 6px solid #8b5cf6; }
        .card-create  { border-left: 6px solid #fbbf24; }

        .accordion-item.active {
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            transform: translateY(-2px);
        }
        .loading-shimmer {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 1rem;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .input-field {
            width: 100%; padding: 14px 16px;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px; color: white; font-size: 14px;
            outline: none; transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        .input-field::placeholder { color: rgba(255,255,255,0.6); }
        .input-field:focus { border-color: rgba(255,255,255,0.5); }

        /* 編輯行程 Sheet */
        .edit-sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .edit-sheet-overlay.show { opacity: 1; pointer-events: all; }
        .edit-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-radius: 28px 28px 0 0;
            padding: 0 20px 40px; z-index: 301;
            transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90vh; overflow-y: auto;
        }
        .edit-sheet.show { transform: translateY(0); }
        .sheet-handle {
            width: 36px; height: 4px; background: #e2e8f0;
            border-radius: 2px; margin: 12px auto 20px;
        }
        .sheet-input {
            width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0;
            border-radius: 14px; font-size: 14px; font-family: inherit;
            outline: none; transition: border-color 0.2s; background: #f8fafc;
            -webkit-appearance: none; box-sizing: border-box;
        }
        .sheet-input:focus { border-color: #0891b2; background: white; }

        /* 刪除確認 Modal */
        .trip-delete-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 400; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .trip-delete-modal-overlay.show { opacity: 1; pointer-events: all; }
        .trip-delete-modal {
            background: white; border-radius: 24px;
            padding: 28px 24px; width: calc(100% - 48px); max-width: 340px;
            transform: scale(0.92); transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .trip-delete-modal-overlay.show .trip-delete-modal { transform: scale(1); }

        /* 長按效果 */
        .trip-card-pressable { transition: transform 0.15s, opacity 0.15s; -webkit-tap-highlight-color: transparent; }
        .trip-card-pressable.pressing { transform: scale(0.97); opacity: 0.8; }

        /* 共享管理 Sheet */
        .share-sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .share-sheet-overlay.show { opacity: 1; pointer-events: all; }
        .share-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-radius: 28px 28px 0 0;
            padding: 0 20px 40px; z-index: 501;
            transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 85vh; overflow-y: auto;
        }
        .share-sheet.show { transform: translateY(0); }
        .collaborator-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 0; border-bottom: 1px solid #f1f5f9;
        }
        .collaborator-row:last-child { border-bottom: none; }
    </style>
</head>
<body class="pb-10">

    <div id="welcome" class="welcome-screen">
        <div class="relative flex items-center justify-center">
            <svg class="loader-svg" width="140" height="140">
                <circle class="loader-circle" cx="70" cy="70" r="55"></circle>
            </svg>
            <h1 class="welcome-text text-xl">歡迎回來</h1>
        </div>
    </div>

    <header class="p-8 flex justify-between items-start">
        <div>
            <h1 class="text-3xl font-black tracking-tight text-slate-800">旅遊助手</h1>
            <!-- 動態問候語，由 JS 填入使用者名稱 -->
            <p id="greeting" class="text-slate-500 text-sm mt-1">準備好去哪冒險了嗎？</p>
        </div>
        <button onclick="handleLogout()" class="mt-1 p-2 bg-white border border-slate-200 rounded-xl text-slate-400 active:scale-95 transition-all">
            <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
    </header>

    <main class="px-6 space-y-6">

        <!-- 歷史行程 -->
        <div class="accordion-item card-history bg-white rounded-[2rem] p-6 border border-slate-100 transition-all cursor-pointer" onclick="toggleAccordion(this)">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-slate-100 rounded-2xl text-slate-600 shadow-inner">
                        <i data-lucide="archive" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-slate-700 text-lg">歷史行程</h3>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Past Memories</p>
                    </div>
                </div>
                <div class="p-2 rounded-full bg-slate-50 text-slate-300">
                    <i data-lucide="chevron-down" class="chevron-icon w-5 h-5"></i>
                </div>
            </div>
            <div class="accordion-content">
                <div id="list-history" class="space-y-3">
                    <div class="loading-shimmer h-16"></div>
                </div>
            </div>
        </div>

        <!-- 規劃中行程 -->
        <div class="accordion-item card-ongoing bg-white rounded-[2rem] p-6 border border-slate-100 transition-all cursor-pointer" onclick="toggleAccordion(this)">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-cyan-50 rounded-2xl text-cyan-600 shadow-inner">
                        <i data-lucide="compass" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-slate-700 text-lg">規劃中行程</h3>
                        <p class="text-[10px] text-cyan-500 font-bold uppercase tracking-wider">Current Planning</p>
                    </div>
                </div>
                <div class="p-2 rounded-full bg-cyan-50 text-cyan-200">
                    <i data-lucide="chevron-down" class="chevron-icon w-5 h-5"></i>
                </div>
            </div>
            <div class="accordion-content">
                <div id="list-ongoing" class="space-y-3">
                    <div class="loading-shimmer h-16"></div>
                </div>
            </div>
        </div>

        <!-- 共享行程（協作者身份，有資料才顯示） -->
        <div id="section-shared" class="accordion-item card-shared bg-white rounded-[2rem] p-6 border border-slate-100 transition-all cursor-pointer" onclick="toggleAccordion(this)" style="display:none">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-purple-50 rounded-2xl text-purple-600 shadow-inner">
                        <i data-lucide="users" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-slate-700 text-lg">共享行程</h3>
                        <p class="text-[10px] text-purple-500 font-bold uppercase tracking-wider">Shared With Me</p>
                    </div>
                </div>
                <div class="p-2 rounded-full bg-purple-50 text-purple-200">
                    <i data-lucide="chevron-down" class="chevron-icon w-5 h-5"></i>
                </div>
            </div>
            <div class="accordion-content">
                <div id="list-shared" class="space-y-3"></div>
            </div>
        </div>

        <!-- 建立新行程 -->
        <div class="accordion-item card-create bg-[#f59e0b] rounded-[2rem] p-6 border border-none transition-all cursor-pointer shadow-lg shadow-amber-200/50" onclick="toggleAccordion(this)">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-white/20 rounded-2xl text-white">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-white text-lg" style="text-shadow: 0 1px 2px rgba(0,0,0,0.15);">建立新行程</h3>
                        <p class="text-[10px] text-white/90 font-bold uppercase tracking-wider" style="text-shadow: 0 1px 1px rgba(0,0,0,0.1);">New Adventure</p>
                    </div>
                </div>
                <div class="p-2 rounded-full bg-white/20 text-white">
                    <i data-lucide="chevron-down" class="chevron-icon w-5 h-5"></i>
                </div>
            </div>
            <div class="accordion-content" onclick="event.stopPropagation()">
                <div class="space-y-4 bg-black/5 p-4 rounded-3xl mt-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-white ml-1 tracking-widest">DESTINATION</label>
                        <input id="new-destination" type="text" placeholder="準備去哪裡冒險？" class="input-field" maxlength="10">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-white ml-1 tracking-widest">TRIP NAME</label>
                        <input id="new-title" type="text" placeholder="替行程取個名字吧！" class="input-field" maxlength="15">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-white ml-1 tracking-widest">START</label>
                            <input id="new-start" type="date" class="input-field text-xs">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-white ml-1 tracking-widest">END</label>
                            <input id="new-end" type="date" class="input-field text-xs">
                        </div>
                    </div>
                    <div id="create-error" class="text-white/80 text-xs font-bold hidden"></div>
                    <button id="btn-create" onclick="handleCreateTrip()" class="w-full bg-[#334155] text-white p-4 rounded-2xl font-black text-sm shadow-lg shadow-amber-600/20 active:scale-95 transition-transform">
                        完成
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- 編輯行程 Sheet -->
    <div id="edit-sheet-overlay" class="edit-sheet-overlay" onclick="closeEditSheet()"></div>
    <div id="edit-sheet" class="edit-sheet">
        <div class="sheet-handle"></div>
        <h3 class="text-lg font-black text-slate-800 mb-5">編輯行程</h3>
        <div class="mb-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">旅遊地點 <span class="text-red-400">*</span></label>
            <input id="edit-destination" type="text" class="sheet-input" maxlength="10" placeholder="準備去哪裡冒險？">
        </div>
        <div class="mb-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">行程名稱 <span class="text-red-400">*</span></label>
            <input id="edit-title" type="text" class="sheet-input" maxlength="15" placeholder="替行程取個名字吧！">
        </div>
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">START <span class="text-red-400">*</span></label>
                <input id="edit-start" type="date" class="sheet-input text-sm">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">END <span class="text-red-400">*</span></label>
                <input id="edit-end" type="date" class="sheet-input text-sm">
            </div>
        </div>
        <div id="edit-error" class="text-red-500 text-xs font-bold mb-3 hidden"></div>
        <button id="edit-submit-btn" onclick="submitEditTrip()" class="w-full bg-cyan-600 text-white py-4 rounded-2xl font-black text-sm active:scale-95 transition-all shadow-lg shadow-cyan-100 mb-3">儲存</button>
        <button id="share-manage-btn" onclick="openShareSheet()" class="w-full bg-purple-50 text-purple-600 border border-purple-200 py-3.5 rounded-2xl font-black text-sm active:scale-95 transition-all mb-3 hidden flex items-center justify-center gap-2">
            <i data-lucide="users" class="w-4 h-4"></i> 管理共享成員
        </button>
        <button onclick="openTripDeleteModal()" class="w-full bg-red-50 text-red-500 border border-red-200 py-3.5 rounded-2xl font-black text-sm active:scale-95 transition-all">刪除這個行程</button>
    </div>

    <!-- 共享管理 Sheet -->
    <div id="share-sheet-overlay" class="share-sheet-overlay" onclick="closeShareSheet()"></div>
    <div id="share-sheet" class="share-sheet">
        <div class="sheet-handle"></div>
        <div class="flex items-center gap-3 mb-1">
            <div class="p-2 bg-purple-50 rounded-xl">
                <i data-lucide="users" class="w-5 h-5 text-purple-500"></i>
            </div>
            <h3 class="text-lg font-black text-slate-800">共享管理</h3>
        </div>
        <p id="share-sheet-trip-name" class="text-xs text-slate-400 font-bold mb-5 ml-1"></p>

        <!-- 現有協作者列表 -->
        <div class="mb-5">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-3">已共享給</label>
            <div id="collaborator-list" class="min-h-[48px]">
                <div class="loading-shimmer h-10"></div>
            </div>
        </div>

        <!-- 新增成員 -->
        <div class="mb-2">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">新增成員</label>
            <div class="flex gap-2">
                <input id="invite-email" type="email" placeholder="輸入對方的 Email" class="sheet-input flex-1"
                    onkeydown="if(event.key==='Enter') inviteCollaborator()">
                <button onclick="inviteCollaborator()" id="invite-btn"
                    class="flex-none bg-purple-500 text-white px-4 rounded-2xl font-black text-sm active:scale-95 transition-all whitespace-nowrap">
                    邀請
                </button>
            </div>
            <p class="text-[10px] text-slate-300 mt-1.5 px-1">請輸入已在此 App 註冊的用戶 Email</p>
        </div>
        <div id="share-error" class="text-red-500 text-xs font-bold mt-2 hidden"></div>
        <div id="share-success" class="text-green-500 text-xs font-bold mt-2 hidden"></div>
    </div>

    <!-- 縮短日期確認 Modal -->
    <div id="shrink-date-modal-overlay" class="trip-delete-modal-overlay">
        <div class="trip-delete-modal">
            <div class="flex items-center gap-3 mb-3">
                <div class="p-2 bg-amber-50 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                    </svg>
                </div>
                <h4 class="font-black text-slate-800 text-base">日期縮短警告</h4>
            </div>
            <p id="shrink-date-msg" class="text-sm text-slate-500 mb-6 leading-relaxed"></p>
            <div class="flex gap-3">
                <button onclick="closeShrinkDateModal()" class="flex-1 py-3.5 rounded-2xl border border-slate-200 text-slate-600 font-black text-sm active:scale-95 transition-all">取消</button>
                <button onclick="confirmShrinkDate()" class="flex-1 py-3.5 rounded-2xl bg-amber-500 text-white font-black text-sm active:scale-95 transition-all shadow-lg shadow-amber-100">確認儲存</button>
            </div>
        </div>
    </div>

    <!-- 刪除確認 Modal -->
    <div id="trip-delete-modal-overlay" class="trip-delete-modal-overlay">
        <div class="trip-delete-modal">
            <div class="flex items-center gap-3 mb-3">
                <div class="p-2 bg-red-50 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                    </svg>
                </div>
                <h4 class="font-black text-slate-800 text-base">確認刪除行程？</h4>
            </div>
            <p class="text-sm text-slate-500 mb-6 leading-relaxed">刪除後，該行程的所有活動、支出、照片紀錄將一併永久刪除，無法復原。</p>
            <div class="flex gap-3">
                <button onclick="closeTripDeleteModal()" class="flex-1 py-3.5 rounded-2xl border border-slate-200 text-slate-600 font-black text-sm active:scale-95 transition-all">取消</button>
                <button onclick="confirmDeleteTrip()" class="flex-1 py-3.5 rounded-2xl bg-red-500 text-white font-black text-sm active:scale-95 transition-all shadow-lg shadow-red-100">確認刪除</button>
            </div>
        </div>
    </div>

    <script>
        const { createClient } = supabase;
        const db = createClient(
            'https://lcdugmmnjfrvfdbzpwma.supabase.co',
            'sb_publishable_6Q2ujUjZL0UC9LLDT-3SKA_RzyK330Q'
        );

        let currentUser = null;

        function formatDateRange(start, end) {
            const fmt = d => {
                const dt = new Date(d + 'T00:00:00');
                return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
            };
            return `${fmt(start)} ~ ${fmt(end)}`;
        }

        function tripCardHtml(trip, isShared = false) {
            const border = isShared ? 'border-purple-100' : 'border-cyan-100';
            const bg = isShared ? 'bg-purple-50/50 hover:bg-purple-100/50' : 'bg-cyan-50/50 hover:bg-cyan-100/50';
            const startDate = trip.start_date.slice(5).replace('-','/');
            const endDate = trip.end_date.slice(5).replace('-','/');
            return `
                <a href="detail.html?id=${trip.id}"
                    class="trip-card-pressable flex items-center p-5 ${bg} rounded-2xl border ${border} transition-colors gap-3"
                    ontouchstart="startTripLongPress('${trip.id}', this)"
                    ontouchend="cancelTripLongPress()"
                    ontouchmove="cancelTripLongPress()"
                    onmousedown="startTripLongPress('${trip.id}', this)"
                    onmouseup="cancelTripLongPress()"
                    onmouseleave="cancelTripLongPress()">
                    <div class="flex-1 min-w-0">
                        ${trip.destination ? `<p class="text-sm font-black text-cyan-600 truncate">📍 ${trip.destination}</p>` : '<p class="text-sm">&nbsp;</p>'}
                        <h4 class="font-bold text-slate-700 text-base leading-tight truncate mt-1">${trip.title}</h4>
                    </div>
                    <div class="flex-none text-right">
                        <p class="text-[11px] font-bold text-slate-400">${startDate}</p>
                        <p class="text-[11px] font-bold text-slate-300">〜</p>
                        <p class="text-[11px] font-bold text-slate-400">${endDate}</p>
                    </div>
                </a>`;
        }

        function historyCardHtml(trip) {
            const startDate = trip.start_date.slice(5).replace('-','/');
            const endDate = trip.end_date.slice(5).replace('-','/');
            return `
                <a href="detail.html?id=${trip.id}"
                    class="trip-card-pressable flex items-center p-5 bg-slate-100 hover:bg-slate-200 rounded-2xl border border-slate-200 transition-colors gap-3"
                    ontouchstart="startTripLongPress('${trip.id}', this)"
                    ontouchend="cancelTripLongPress()"
                    ontouchmove="cancelTripLongPress()"
                    onmousedown="startTripLongPress('${trip.id}', this)"
                    onmouseup="cancelTripLongPress()"
                    onmouseleave="cancelTripLongPress()">
                    <div class="flex-1 min-w-0">
                        ${trip.destination ? `<p class="text-sm font-black text-slate-500 truncate">📍 ${trip.destination}</p>` : '<p class="text-sm">&nbsp;</p>'}
                        <h4 class="font-bold text-slate-700 text-base leading-tight truncate mt-1">${trip.title}</h4>
                    </div>
                    <div class="flex-none text-right">
                        <p class="text-[11px] font-bold text-slate-400">${startDate}</p>
                        <p class="text-[11px] font-bold text-slate-300">〜</p>
                        <p class="text-[11px] font-bold text-slate-400">${endDate}</p>
                    </div>
                </a>`;
        }

        function emptyHtml(msg) {
            return `<div class="text-center py-10 bg-slate-50/30 border-2 border-dashed border-slate-100 rounded-[2rem]">
                <p class="text-sm text-slate-400 font-medium">${msg}</p>
            </div>`;
        }

        async function loadProfile() {
            const { data } = await db
                .from('profiles')
                .select('username')
                .eq('id', currentUser.id)
                .single();
            if (data?.username) {
                document.getElementById('greeting').textContent = `${data.username}，準備好去哪冒險了嗎？`;
            }
        }

        const TRIP_LIMIT = 3;
        let cachedTripsData = {};

        function renderTripList(containerId, trips, cardFn) {
            const el = document.getElementById(containerId);
            if (!el) return;
            if (!trips.length) { el.innerHTML = emptyHtml('暫無行程'); return; }

            const visible = trips.slice(0, TRIP_LIMIT);
            const hidden = trips.slice(TRIP_LIMIT);

            let html = `<div class="space-y-3">${visible.map(t => cardFn(t)).join('')}</div>`;

            if (hidden.length) {
                html += `<div id="${containerId}-hidden" class="space-y-3 hidden mt-3">
                    ${hidden.map(t => cardFn(t)).join('')}
                </div>
                <button id="${containerId}-more-btn" onclick="event.stopPropagation(); loadMoreTrips('${containerId}')"
                    class="w-full mt-3 py-3 text-xs font-bold text-slate-400 border border-slate-200 rounded-2xl active:scale-95 transition-all bg-white">
                    載入更多
                </button>`;
            }

            el.innerHTML = html;
            lucide.createIcons();
        }

        function loadMoreTrips(containerId) {
            const hidden = document.getElementById(`${containerId}-hidden`);
            const btn = document.getElementById(`${containerId}-more-btn`);
            if (hidden) hidden.classList.remove('hidden');
            if (btn) btn.remove();
        }

        async function loadTrips() {
            const today = new Date().toISOString().split('T')[0];

            const { data: myTrips } = await db
                .from('trips')
                .select('*')
                .eq('owner_id', currentUser.id)
                .order('start_date', { ascending: false });

            const { data: sharedData } = await db
                .from('trip_collaborators')
                .select('trip_id, trips(*)')
                .eq('user_id', currentUser.id);

            const my = myTrips || [];
            const shared = (sharedData || []).map(r => r.trips).filter(Boolean);

            const sharedOngoing = shared.filter(t => t.end_date >= today)
                .sort((a, b) => a.start_date > b.start_date ? 1 : -1);
            const sharedHistory = shared.filter(t => t.end_date < today)
                .sort((a, b) => a.end_date > b.end_date ? -1 : 1);

            const myOngoing = my.filter(t => t.end_date >= today)
                .sort((a, b) => a.start_date > b.start_date ? 1 : -1);
            const myHistory = my.filter(t => t.end_date < today)
                .sort((a, b) => a.end_date > b.end_date ? -1 : 1);

            const ongoingTrips = [...myOngoing, ...sharedOngoing]
                .sort((a, b) => a.start_date > b.start_date ? 1 : -1);
            const historyTrips = [...myHistory, ...sharedHistory]
                .sort((a, b) => a.end_date > b.end_date ? -1 : 1);

            cachedTripsData = {
                ongoing: { trips: ongoingTrips, sharedIds: new Set(sharedOngoing.map(t => t.id)) },
                history: { trips: historyTrips },
                shared: { trips: sharedOngoing }
            };

            renderTripList('list-ongoing', ongoingTrips,
                t => tripCardHtml(t, cachedTripsData.ongoing.sharedIds.has(t.id)));
            renderTripList('list-history', historyTrips, historyCardHtml);

            if (sharedOngoing.length) {
                document.getElementById('section-shared').style.display = 'block';
                renderTripList('list-shared', sharedOngoing, t => tripCardHtml(t, true));
            } else {
                document.getElementById('section-shared').style.display = 'none';
            }
        }

        async function handleCreateTrip() {
            const destination = document.getElementById('new-destination').value.trim();
            const title = document.getElementById('new-title').value.trim();
            const start = document.getElementById('new-start').value;
            const end   = document.getElementById('new-end').value;
            const errEl = document.getElementById('create-error');
            const btn   = document.getElementById('btn-create');

            errEl.classList.add('hidden');
            if (!destination)  { errEl.textContent = '請輸入旅遊地點';           errEl.classList.remove('hidden'); return; }
            if (!title)        { errEl.textContent = '請輸入行程名稱';           errEl.classList.remove('hidden'); return; }
            if (!start || !end){ errEl.textContent = '請選擇出發和結束日期';     errEl.classList.remove('hidden'); return; }
            if (end < start)   { errEl.textContent = '結束日期不能早於出發日期'; errEl.classList.remove('hidden'); return; }

            btn.disabled = true; btn.textContent = '建立中...';

            const { error } = await db.from('trips').insert({
                owner_id: currentUser.id,
                title,
                destination: destination || null,
                start_date: start,
                end_date: end
            });

            btn.disabled = false; btn.textContent = '完成';

            if (error) {
                errEl.textContent = error.message;
                errEl.classList.remove('hidden');
                return;
            }

            const { data: newTrip } = await db
                .from('trips')
                .select('id')
                .eq('owner_id', currentUser.id)
                .eq('title', title)
                .eq('start_date', start)
                .order('created_at', { ascending: false })
                .limit(1)
                .single();

            window.location.href = `detail.html?id=${newTrip.id}`;
        }

        // ============================================
        // 行程編輯 CRUD
        // ============================================
        let tripLongPressTimer = null;
        let editingTripId = null;

        function startTripLongPress(tripId, el) {
            el.classList.add('pressing');
            tripLongPressTimer = setTimeout(() => {
                el.classList.remove('pressing');
                openEditSheet(tripId);
            }, 500);
        }

        function cancelTripLongPress() {
            clearTimeout(tripLongPressTimer);
            document.querySelectorAll('.trip-card-pressable.pressing')
                .forEach(el => el.classList.remove('pressing'));
        }

        function openEditSheet(tripId) {
            editingTripId = tripId;

            // 從快取找到該行程資料
            const allTrips = [
                ...(cachedTripsData.ongoing?.trips || []),
                ...(cachedTripsData.history?.trips || []),
                ...(cachedTripsData.shared?.trips || [])
            ];
            const trip = allTrips.find(t => t.id === tripId);
            if (!trip) return;

            document.getElementById('edit-destination').value = trip.destination || '';
            document.getElementById('edit-title').value = trip.title || '';
            document.getElementById('edit-start').value = trip.start_date || '';
            document.getElementById('edit-end').value = trip.end_date || '';
            document.getElementById('edit-error').classList.add('hidden');

            // 只有行程 owner 才顯示「管理共享成員」按鈕
            const shareBtn = document.getElementById('share-manage-btn');
            if (trip.owner_id === currentUser.id) {
                shareBtn.classList.remove('hidden');
            } else {
                shareBtn.classList.add('hidden');
            }

            document.getElementById('edit-sheet-overlay').classList.add('show');
            document.getElementById('edit-sheet').classList.add('show');
        }

        function closeEditSheet() {
            document.getElementById('edit-sheet-overlay').classList.remove('show');
            document.getElementById('edit-sheet').classList.remove('show');
            editingTripId = null;
        }

        // ============================================
        // 共享管理
        // ============================================
        let sharingTripId = null;

        async function openShareSheet() {
            sharingTripId = editingTripId;

            // 關閉編輯 sheet，切換到共享 sheet
            document.getElementById('edit-sheet-overlay').classList.remove('show');
            document.getElementById('edit-sheet').classList.remove('show');

            // 填入行程名稱
            const allTrips = [
                ...(cachedTripsData.ongoing?.trips || []),
                ...(cachedTripsData.history?.trips || []),
                ...(cachedTripsData.shared?.trips || [])
            ];
            const trip = allTrips.find(t => t.id === sharingTripId);
            document.getElementById('share-sheet-trip-name').textContent = trip ? trip.title : '';

            // 重置 UI
            document.getElementById('invite-email').value = '';
            document.getElementById('share-error').classList.add('hidden');
            document.getElementById('share-success').classList.add('hidden');
            document.getElementById('collaborator-list').innerHTML =
                '<div class="loading-shimmer h-10"></div>';

            document.getElementById('share-sheet-overlay').classList.add('show');
            document.getElementById('share-sheet').classList.add('show');
            lucide.createIcons();

            await loadCollaborators();
        }

        function closeShareSheet() {
            document.getElementById('share-sheet-overlay').classList.remove('show');
            document.getElementById('share-sheet').classList.remove('show');
            sharingTripId = null;
        }

        async function loadCollaborators() {
            const { data, error } = await db
                .from('trip_collaborators')
                .select('id, user_id, profiles(username)')
                .eq('trip_id', sharingTripId);

            const listEl = document.getElementById('collaborator-list');

            if (error || !data || data.length === 0) {
                listEl.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">尚未共享給任何人</p>`;
                return;
            }

            listEl.innerHTML = data.map(c => `
                <div class="collaborator-row" id="collab-row-${c.id}">
                    <div class="w-8 h-8 rounded-full bg-purple-100 flex items-center justify-center flex-none">
                        <span class="text-purple-600 font-black text-xs">
                            ${(c.profiles?.username || '?').charAt(0).toUpperCase()}
                        </span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-slate-700 truncate">
                            ${c.profiles?.username || '未知用戶'}
                        </p>
                        <p class="text-[10px] text-slate-400 font-bold">可編輯</p>
                    </div>
                    <button onclick="removeCollaborator('${c.id}')"
                        class="flex-none text-xs font-black text-red-400 border border-red-200 bg-red-50 px-3 py-1.5 rounded-xl active:scale-95 transition-all">
                        移除
                    </button>
                </div>
            `).join('');
        }

        async function removeCollaborator(collaboratorId) {
            const { error } = await db
                .from('trip_collaborators')
                .delete()
                .eq('id', collaboratorId);

            if (error) {
                document.getElementById('share-error').textContent = '移除失敗，請再試一次';
                document.getElementById('share-error').classList.remove('hidden');
                return;
            }

            // 移除該列的 DOM
            const row = document.getElementById(`collab-row-${collaboratorId}`);
            if (row) row.remove();

            // 若列表空了，顯示空狀態
            const listEl = document.getElementById('collaborator-list');
            if (!listEl.querySelector('.collaborator-row')) {
                listEl.innerHTML = `<p class="text-sm text-slate-400 text-center py-4">尚未共享給任何人</p>`;
            }

            // 重新載入首頁行程列表（共享區塊可能消失）
            loadTrips();
        }

        async function inviteCollaborator() {
            const emailInput = document.getElementById('invite-email');
            const email = emailInput.value.trim().toLowerCase();
            const errEl = document.getElementById('share-error');
            const succEl = document.getElementById('share-success');
            const btn = document.getElementById('invite-btn');

            errEl.classList.add('hidden');
            succEl.classList.add('hidden');

            if (!email) {
                errEl.textContent = '請輸入 Email';
                errEl.classList.remove('hidden');
                return;
            }

            // 不能邀請自己
            if (email === currentUser.email) {
                errEl.textContent = '不能將行程分享給自己';
                errEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = '查詢中...';

            // 透過 RPC 查詢 user_id（需在 Supabase 建立此 function）
            const { data: targetUserId, error: rpcError } = await db
                .rpc('get_user_id_by_email', { target_email: email });

            if (rpcError || !targetUserId) {
                errEl.textContent = '找不到此 Email 對應的用戶，請確認對方已註冊';
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = '邀請';
                return;
            }

            // 檢查是否已是協作者
            const { data: existing } = await db
                .from('trip_collaborators')
                .select('id')
                .eq('trip_id', sharingTripId)
                .eq('user_id', targetUserId)
                .maybeSingle();

            if (existing) {
                errEl.textContent = '此用戶已是協作者';
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = '邀請';
                return;
            }

            // 新增協作者
            const { error: insertError } = await db
                .from('trip_collaborators')
                .insert({ trip_id: sharingTripId, user_id: targetUserId, role: 'editor' });

            btn.disabled = false;
            btn.textContent = '邀請';

            if (insertError) {
                errEl.textContent = '邀請失敗，請再試一次';
                errEl.classList.remove('hidden');
                return;
            }

            emailInput.value = '';
            succEl.textContent = `已成功邀請，對方行程列表將可看到此行程`;
            succEl.classList.remove('hidden');

            // 重新載入協作者列表
            await loadCollaborators();
        }

        let pendingEditData = null;

        async function submitEditTrip() {
            const destination = document.getElementById('edit-destination').value.trim();
            const title = document.getElementById('edit-title').value.trim();
            const start = document.getElementById('edit-start').value;
            const end = document.getElementById('edit-end').value;
            const errEl = document.getElementById('edit-error');

            errEl.classList.add('hidden');
            if (!destination) { errEl.textContent = '請輸入旅遊地點'; errEl.classList.remove('hidden'); return; }
            if (!title) { errEl.textContent = '請輸入行程名稱'; errEl.classList.remove('hidden'); return; }
            if (!start || !end) { errEl.textContent = '請選擇起訖日期'; errEl.classList.remove('hidden'); return; }
            if (end < start) { errEl.textContent = '結束日期不能早於出發日期'; errEl.classList.remove('hidden'); return; }

            // 找出原本的行程資料
            const allTrips = [
                ...(cachedTripsData.ongoing?.trips || []),
                ...(cachedTripsData.history?.trips || []),
                ...(cachedTripsData.shared?.trips || [])
            ];
            const originalTrip = allTrips.find(t => t.id === editingTripId);

            // 檢查是否縮短日期，若有則檢查被移除的日期是否有活動
            if (originalTrip && (start > originalTrip.start_date || end < originalTrip.end_date)) {
                const btn = document.getElementById('edit-submit-btn');
                btn.disabled = true; btn.textContent = '檢查中...';

                const { data: affectedItems } = await db
                    .from('schedule_items')
                    .select('date')
                    .eq('trip_id', editingTripId)
                    .or(`date.lt.${start},date.gt.${end}`);

                btn.disabled = false; btn.textContent = '儲存';

                if (affectedItems && affectedItems.length > 0) {
                    const affectedDates = [...new Set(affectedItems.map(i => i.date))].sort();
                    const dateList = affectedDates.map(d => formatDateRange(d, d).split(' ~')[0]).join('、');
                    document.getElementById('shrink-date-msg').textContent =
                        `以下日期共有 ${affectedItems.length} 筆活動將被刪除：${dateList}。確定要繼續嗎？`;
                    pendingEditData = { destination, title, start, end, affectedDates };
                    document.getElementById('shrink-date-modal-overlay').classList.add('show');
                    return;
                }
            }

            await executeEditTrip(destination, title, start, end);
        }

        function closeShrinkDateModal() {
            document.getElementById('shrink-date-modal-overlay').classList.remove('show');
            pendingEditData = null;
        }

        async function confirmShrinkDate() {
            if (!pendingEditData) return;
            const { destination, title, start, end, affectedDates } = pendingEditData;
            closeShrinkDateModal();

            // 刪除超出範圍日期的活動
            for (const date of affectedDates) {
                await db.from('schedule_items')
                    .delete()
                    .eq('trip_id', editingTripId)
                    .eq('date', date);
            }

            await executeEditTrip(destination, title, start, end);
        }

        async function executeEditTrip(destination, title, start, end) {
            const errEl = document.getElementById('edit-error');
            const btn = document.getElementById('edit-submit-btn');
            btn.disabled = true; btn.textContent = '儲存中...';

            const { error } = await db.from('trips').update({
                destination, title, start_date: start, end_date: end
            }).eq('id', editingTripId);

            btn.disabled = false; btn.textContent = '儲存';

            if (error) {
                errEl.textContent = '儲存失敗，請再試一次';
                errEl.classList.remove('hidden');
                return;
            }

            closeEditSheet();
            await loadTrips();
        }

        function openTripDeleteModal() {
            document.getElementById('trip-delete-modal-overlay').classList.add('show');
        }

        function closeTripDeleteModal() {
            document.getElementById('trip-delete-modal-overlay').classList.remove('show');
        }

        async function confirmDeleteTrip() {
            if (!editingTripId) return;

            const { error } = await db.from('trips').delete().eq('id', editingTripId);

            if (error) {
                closeTripDeleteModal();
                const errEl = document.getElementById('edit-error');
                errEl.textContent = '刪除失敗，請再試一次';
                errEl.classList.remove('hidden');
                return;
            }

            closeTripDeleteModal();
            closeEditSheet();
            await loadTrips();
        }

        async function handleLogout() {
            await db.auth.signOut();
            window.location.href = 'login.html';
        }

        function toggleAccordion(element) {
            const wasActive = element.classList.contains('active');

            document.querySelectorAll('.accordion-item').forEach(item => {
                if (item.classList.contains('active')) {
                    item.classList.remove('active');
                    const listEl = item.querySelector('[id^="list-"]');
                    if (listEl && Object.keys(cachedTripsData).length) {
                        const key = listEl.id.replace('list-', '');
                        const d = cachedTripsData[key];
                        if (d) {
                            if (key === 'ongoing') renderTripList(listEl.id, d.trips, t => tripCardHtml(t, d.sharedIds.has(t.id)));
                            else if (key === 'history') renderTripList(listEl.id, d.trips, historyCardHtml);
                            else if (key === 'shared') renderTripList(listEl.id, d.trips, t => tripCardHtml(t, true));
                        }
                    }
                }
            });

            if (!wasActive) element.classList.add('active');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            setTimeout(() => {
                const welcome = document.getElementById('welcome');
                welcome.classList.add('welcome-fade-out');
                setTimeout(() => welcome.remove(), 800);
            }, 2300);

            const { data } = await db.auth.getSession();
            if (!data.session) { window.location.href = 'login.html'; return; }

            currentUser = data.session.user;

            // 同時載入名稱和行程，不互相等待
            await Promise.all([loadProfile(), loadTrips()]);
            lucide.createIcons();
        });
    </script>
