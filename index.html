<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅遊助手 - 總覽</title>
    <link rel="manifest" href="manifest.json?v=0318">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { background: #f1f5f9; font-family: 'Inter', 'Noto Sans TC', sans-serif; }

        .welcome-screen {
            position: fixed; inset: 0; background: #0f172a;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .loader-svg { transform: rotate(-90deg); }
        .loader-circle {
            fill: none; stroke: #fbbf24; stroke-width: 4; stroke-linecap: round;
            stroke-dasharray: 345; stroke-dashoffset: 345;
            animation: progress 1.5s ease-in-out forwards;
        }
        @keyframes progress { to { stroke-dashoffset: 0; } }
        .welcome-text {
            position: absolute; color: white; font-weight: bold;
            opacity: 0; transform: translateY(10px);
            animation: textFadeUp 0.8s ease-out 0.3s forwards;
        }
        @keyframes textFadeUp { to { opacity: 1; transform: translateY(0); } }
        .welcome-fade-out { opacity: 0; transform: scale(1.1); pointer-events: none; }

        .accordion-content {
            max-height: 0; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }
        .accordion-item.active .accordion-content {
            max-height: 1000px; opacity: 1; margin-top: 1.5rem;
        }
        .chevron-icon { transition: transform 0.4s; }
        .accordion-item.active .chevron-icon { transform: rotate(180deg); }

        .card-history { border-left: 6px solid #64748b; }
        .card-ongoing { border-left: 6px solid #0891b2; }
        .card-shared  { border-left: 6px solid #8b5cf6; }
        .card-create  { border-left: 6px solid #fbbf24; }

        .accordion-item.active {
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            transform: translateY(-2px);
        }
        .loading-shimmer {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 1rem;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .input-field {
            width: 100%; padding: 14px 16px;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px; color: white; font-size: 14px;
            outline: none; transition: border-color 0.2s;
            -webkit-appearance: none;
        }
        .input-field::placeholder { color: rgba(255,255,255,0.6); }
        .input-field:focus { border-color: rgba(255,255,255,0.5); }
    </style>
</head>
<body class="pb-10">

    <div id="welcome" class="welcome-screen">
        <div class="relative flex items-center justify-center">
            <svg class="loader-svg" width="140" height="140">
                <circle class="loader-circle" cx="70" cy="70" r="55"></circle>
            </svg>
            <h1 class="welcome-text text-xl">歡迎回來</h1>
        </div>
    </div>

    <header class="p-8 flex justify-between items-start">
        <div>
            <h1 class="text-3xl font-black tracking-tight text-slate-800">旅遊助手</h1>
            <!-- 動態問候語，由 JS 填入使用者名稱 -->
            <p id="greeting" class="text-slate-500 text-sm mt-1">準備好去哪冒險了嗎？</p>
        </div>
        <button onclick="handleLogout()" class="mt-1 p-2 bg-white border border-slate-200 rounded-xl text-slate-400 active:scale-95 transition-all">
            <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
    </header>

    <main class="px-6 space-y-6">

        <!-- 歷史行程 -->
        <div class="accordion-item card-history bg-white rounded-[2rem] p-6 border border-slate-100 transition-all cursor-pointer" onclick="toggleAccordion(this)">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-slate-100 rounded-2xl text-slate-600 shadow-inner">
                        <i data-lucide="archive" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-slate-700 text-lg">歷史行程</h3>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Past Memories</p>
                    </div>
                </div>
                <div class="p-2 rounded-full bg-slate-50 text-slate-300">
                    <i data-lucide="chevron-down" class="chevron-icon w-5 h-5"></i>
                </div>
            </div>
            <div class="accordion-content">
                <div id="list-history" class="space-y-3">
                    <div class="loading-shimmer h-16"></div>
                </div>
            </div>
        </div>

        <!-- 規劃中行程 -->
        <div class="accordion-item card-ongoing bg-white rounded-[2rem] p-6 border border-slate-100 transition-all cursor-pointer" onclick="toggleAccordion(this)">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-cyan-50 rounded-2xl text-cyan-600 shadow-inner">
                        <i data-lucide="compass" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-slate-700 text-lg">規劃中行程</h3>
                        <p class="text-[10px] text-cyan-500 font-bold uppercase tracking-wider">Current Planning</p>
                    </div>
                </div>
                <div class="p-2 rounded-full bg-cyan-50 text-cyan-200">
                    <i data-lucide="chevron-down" class="chevron-icon w-5 h-5"></i>
                </div>
            </div>
            <div class="accordion-content">
                <div id="list-ongoing" class="space-y-3">
                    <div class="loading-shimmer h-16"></div>
                </div>
            </div>
        </div>

        <!-- 共享行程（協作者身份，有資料才顯示） -->
        <div id="section-shared" class="accordion-item card-shared bg-white rounded-[2rem] p-6 border border-slate-100 transition-all cursor-pointer" onclick="toggleAccordion(this)" style="display:none">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-purple-50 rounded-2xl text-purple-600 shadow-inner">
                        <i data-lucide="users" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-slate-700 text-lg">共享行程</h3>
                        <p class="text-[10px] text-purple-500 font-bold uppercase tracking-wider">Shared With Me</p>
                    </div>
                </div>
                <div class="p-2 rounded-full bg-purple-50 text-purple-200">
                    <i data-lucide="chevron-down" class="chevron-icon w-5 h-5"></i>
                </div>
            </div>
            <div class="accordion-content">
                <div id="list-shared" class="space-y-3"></div>
            </div>
        </div>

        <!-- 建立新行程 -->
        <div class="accordion-item card-create bg-[#f59e0b] rounded-[2rem] p-6 border border-none transition-all cursor-pointer shadow-lg shadow-amber-200/50" onclick="toggleAccordion(this)">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-white/20 rounded-2xl text-white">
                        <i data-lucide="plus" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-extrabold text-white text-lg" style="text-shadow: 0 1px 2px rgba(0,0,0,0.15);">建立新行程</h3>
                        <p class="text-[10px] text-white/90 font-bold uppercase tracking-wider" style="text-shadow: 0 1px 1px rgba(0,0,0,0.1);">New Adventure</p>
                    </div>
                </div>
                <div class="p-2 rounded-full bg-white/20 text-white">
                    <i data-lucide="chevron-down" class="chevron-icon w-5 h-5"></i>
                </div>
            </div>
            <div class="accordion-content" onclick="event.stopPropagation()">
                <div class="space-y-4 bg-black/5 p-4 rounded-3xl mt-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-white ml-1 tracking-widest">TRIP NAME</label>
                        <input id="new-title" type="text" placeholder="準備去哪冒險？" class="input-field">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-bold text-white ml-1 tracking-widest">EMOJI</label>
                        <input id="new-emoji" type="text" placeholder="✈️" class="input-field" maxlength="2">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-white ml-1 tracking-widest">START</label>
                            <input id="new-start" type="date" class="input-field text-xs">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-bold text-white ml-1 tracking-widest">END</label>
                            <input id="new-end" type="date" class="input-field text-xs">
                        </div>
                    </div>
                    <div id="create-error" class="text-white/80 text-xs font-bold hidden"></div>
                    <button id="btn-create" onclick="handleCreateTrip()" class="w-full bg-[#334155] text-white p-4 rounded-2xl font-black text-sm shadow-lg shadow-amber-600/20 active:scale-95 transition-transform">
                        完成
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const { createClient } = supabase;
        const db = createClient(
            'https://lcdugmmnjfrvfdbzpwma.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxjZHVnbW1uamZydmZkYnpwd21hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3MjcwNjAsImV4cCI6MjA4OTMwMzA2MH0.hEtomrSaoLuWr9UUi-QJlwHvmlzAn0E_KBb4dfofNO4'
        );

        let currentUser = null;

        function formatDateRange(start, end) {
            const fmt = d => {
                const dt = new Date(d + 'T00:00:00');
                return `${dt.getFullYear()}/${String(dt.getMonth()+1).padStart(2,'0')}/${String(dt.getDate()).padStart(2,'0')}`;
            };
            return `${fmt(start)} ~ ${fmt(end)}`;
        }

        function tripCardHtml(trip, isShared = false) {
            const border = isShared ? 'border-purple-100' : 'border-cyan-100';
            const bg = isShared ? 'bg-purple-50/50 hover:bg-purple-100/50' : 'bg-cyan-50/50 hover:bg-cyan-100/50';
            return `
                <a href="detail.html?id=${trip.id}" class="flex items-center p-5 ${bg} rounded-2xl border ${border} transition-colors">
                    <span class="text-3xl flex-none">${trip.emoji || '✈️'}</span>
                    <div class="flex-1 ml-4 min-w-0">
                        <h4 class="font-black text-slate-700 text-lg leading-tight tracking-tight truncate">${trip.title}</h4>
                        <p class="text-[10px] text-slate-400 font-medium mt-2">${formatDateRange(trip.start_date, trip.end_date)}</p>
                    </div>
                </a>`;
        }

        function historyCardHtml(trip) {
            return `
                <a href="detail.html?id=${trip.id}" class="flex items-center p-5 bg-slate-100 hover:bg-slate-200 rounded-2xl border border-slate-200 transition-colors">
                    <span class="text-3xl flex-none">${trip.emoji || '✈️'}</span>
                    <div class="flex-1 ml-4 min-w-0">
                        <h4 class="font-black text-slate-700 text-lg leading-tight tracking-tight truncate">${trip.title}</h4>
                        <p class="text-[10px] text-slate-400 font-medium mt-2">${formatDateRange(trip.start_date, trip.end_date)}</p>
                    </div>
                </a>`;
        }

        function emptyHtml(msg) {
            return `<div class="text-center py-10 bg-slate-50/30 border-2 border-dashed border-slate-100 rounded-[2rem]">
                <p class="text-sm text-slate-400 font-medium">${msg}</p>
            </div>`;
        }

        async function loadProfile() {
            const { data } = await db
                .from('profiles')
                .select('username')
                .eq('id', currentUser.id)
                .single();
            if (data?.username) {
                document.getElementById('greeting').textContent = `${data.username}，準備好去哪冒險了嗎？`;
            }
        }

        async function loadTrips() {
            const today = new Date().toISOString().split('T')[0];

            const { data: myTrips } = await db
                .from('trips')
                .select('*')
                .eq('owner_id', currentUser.id)
                .order('start_date', { ascending: false });

            const { data: sharedData } = await db
                .from('trip_collaborators')
                .select('trip_id, trips(*)')
                .eq('user_id', currentUser.id);

            const my = myTrips || [];
            const shared = (sharedData || []).map(r => r.trips).filter(Boolean);

            // 自己的行程依時間分流
            const myOngoing = my.filter(t => t.end_date >= today);
            const myHistory = my.filter(t => t.end_date < today);

            // 共享行程依時間分流
            const sharedOngoing = shared.filter(t => t.end_date >= today);
            const sharedHistory = shared.filter(t => t.end_date < today);

            // 規劃中：自己 + 共享（尚未結束）
            const ongoingHtml = [
                ...myOngoing.map(t => tripCardHtml(t)),
                ...sharedOngoing.map(t => tripCardHtml(t, true))
            ];
            document.getElementById('list-ongoing').innerHTML =
                ongoingHtml.length ? ongoingHtml.join('') : emptyHtml('暫無規劃中行程');

            // 歷史：自己 + 共享（已結束）
            const historyHtml = [
                ...myHistory.map(t => historyCardHtml(t)),
                ...sharedHistory.map(t => historyCardHtml(t))
            ];
            document.getElementById('list-history').innerHTML =
                historyHtml.length ? historyHtml.join('') : emptyHtml('暫無歷史行程');

            // 共享行程區塊：只在有進行中共享行程時顯示
            if (sharedOngoing.length) {
                document.getElementById('section-shared').style.display = 'block';
                document.getElementById('list-shared').innerHTML = sharedOngoing.map(t => tripCardHtml(t, true)).join('');
            } else {
                document.getElementById('section-shared').style.display = 'none';
            }

            lucide.createIcons();
        }

        async function handleCreateTrip() {
            const title = document.getElementById('new-title').value.trim();
            const emoji = document.getElementById('new-emoji').value.trim();
            const start = document.getElementById('new-start').value;
            const end   = document.getElementById('new-end').value;
            const errEl = document.getElementById('create-error');
            const btn   = document.getElementById('btn-create');

            errEl.classList.add('hidden');
            if (!title)        { errEl.textContent = '請輸入行程名稱';           errEl.classList.remove('hidden'); return; }
            if (!start || !end){ errEl.textContent = '請選擇出發和結束日期';     errEl.classList.remove('hidden'); return; }
            if (end < start)   { errEl.textContent = '結束日期不能早於出發日期'; errEl.classList.remove('hidden'); return; }

            btn.disabled = true; btn.textContent = '建立中...';

            const { data, error } = await db.from('trips').insert({
                owner_id: currentUser.id,
                title,
                emoji: emoji || '✈️',
                start_date: start,
                end_date: end
            }).select().single();

            btn.disabled = false; btn.textContent = '完成';

            if (error) {
                errEl.textContent = '建立失敗，請再試一次';
                errEl.classList.remove('hidden');
                return;
            }

            window.location.href = `detail.html?id=${data.id}`;
        }

        async function handleLogout() {
            await db.auth.signOut();
            window.location.href = 'login.html';
        }

        function toggleAccordion(element) {
            document.querySelectorAll('.accordion-item').forEach(item => {
                if (item !== element) item.classList.remove('active');
            });
            element.classList.toggle('active');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            setTimeout(() => {
                const welcome = document.getElementById('welcome');
                welcome.classList.add('welcome-fade-out');
                setTimeout(() => welcome.remove(), 800);
            }, 2300);

            const { data } = await db.auth.getSession();
            if (!data.session) { window.location.href = 'login.html'; return; }

            currentUser = data.session.user;

            // 同時載入名稱和行程，不互相等待
            await Promise.all([loadProfile(), loadTrips()]);
            lucide.createIcons();
        });
    </script>
</body>
</html>
