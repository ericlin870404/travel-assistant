name: Update Schema

on:
  schedule:
    # 每天早上 9:00 (UTC+8) = 01:00 UTC 執行
    - cron: '0 1 * * *'
  workflow_dispatch:
    # 允許手動觸發

jobs:
  update-schema:
    name: 更新 Schema 與 Policy 文件
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 執行 Schema 更新腳本
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/update-schema.js

      - name: Commit Schema 檔案
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add supabase/schema.sql supabase/policies.sql
          git diff --staged --quiet || git commit -m "chore: 更新 schema 文件 $(date +'%Y-%m-%d')"
          git push
