    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .active-nav { color: #0891b2; border-top: 3px solid #0891b2; }
        .active-food-tab { background-color: #0891b2 !important; color: white !important; }
        .glass-header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .expand-content { max-height: 0; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; }
        .expanded .expand-content { max-height: 1200px; opacity: 1; }
        .loading-shimmer {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 1rem;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* 照片區塊 */
        .photo-section { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .photo-section-body { overflow: hidden; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); max-height: 0; opacity: 0; }
        .photo-section.open .photo-section-body { max-height: 300px; opacity: 1; }
        .photo-section .chevron-icon { transition: transform 0.3s; }
        .photo-section.open .chevron-icon { transform: rotate(180deg); }

        /* 照片縮圖長按效果 */
        .photo-thumb-btn { transition: transform 0.15s, opacity 0.15s; }
        .photo-thumb-btn.pressing { transform: scale(0.92); opacity: 0.7; }

        /* 放大預覽遮罩 */
        .photo-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            z-index: 200; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .photo-overlay.show { opacity: 1; pointer-events: all; }
        .photo-overlay img { max-width: 92vw; max-height: 80vh; border-radius: 12px; object-fit: contain; }
        .photo-overlay-close {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255,255,255,0.15); border: none;
            color: white; border-radius: 50%; width: 36px; height: 36px;
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .photo-overlay-delete {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(239,68,68,0.85); color: white; border: none;
            padding: 10px 28px; border-radius: 20px; font-size: 13px; font-weight: 700;
            cursor: pointer;
        }

        /* ── 記帳模組 ── */
        /* 左右滑動容器 */
        .expense-slider-wrap {
            overflow: hidden; position: relative;
        }
        .expense-slider {
            display: flex; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        .expense-slide {
            flex: 0 0 100%; min-width: 0;
        }

        /* Tab 指示器 */
        .expense-tab-btn {
            flex: 1; padding: 8px 0; font-size: 12px; font-weight: 800;
            border-bottom: 2px solid transparent; transition: all 0.2s; color: #94a3b8;
        }
        .expense-tab-btn.active { color: #0891b2; border-color: #0891b2; }

        /* 支出卡片 */
        .expense-card {
            background: white; border-radius: 20px;
            border: 1px solid #f1f5f9; transition: all 0.15s;
            display: flex; align-items: center; padding: 14px 16px; gap: 14px;
        }
        .expense-card.delete-mode { border-color: #fecaca; }
        .expense-cat-badge {
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-none;
        }

        /* 底部 Sheet */
        .expense-sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .expense-sheet-overlay.show { opacity: 1; pointer-events: all; }
        .expense-sheet {

            background: white; border-radius: 28px 28px 0 0;
            padding: 0 20px 40px; z-index: 301;
            transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90vh; overflow-y: auto;
        }

        .sheet-handle {

        }
        .sheet-input {
            width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0;

            outline: none; transition: border-color 0.2s; background: #f8fafc;

        // ============================================
        // 照片壓縮
        // ============================================
        function compressImage(file, maxSizeMB = 1) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let { width, height } = img;
                        const maxPx = 1600;
                        if (width > maxPx || height > maxPx) {
                            if (width > height) { height = Math.round(height * maxPx / width); width = maxPx; }
                            else { width = Math.round(width * maxPx / height); height = maxPx; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        let quality = 0.85;
                        const tryCompress = () => {
                            canvas.toBlob((blob) => {
                                if (blob.size <= maxSizeMB * 1024 * 1024 || quality <= 0.3) {
                                    resolve(blob);
                                } else {
                                    quality -= 0.1;
                                    tryCompress();
                                }
                            }, 'image/jpeg', quality);
                        };
                        tryCompress();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // ============================================
        // 照片上傳處理
        // ============================================
        async function handlePhotoSelected(event) {
            const file = event.target.files[0];
            if (!file || !uploadingDate) return;
            event.target.value = '';

            const dateStr = uploadingDate;
            const photoSection = document.getElementById(`photo-section-${dateStr}`);

            // 先檢查當天照片數量
            const { data: existing } = await db
                .from('trip_day_photos')
                .select('id')
                .eq('trip_id', TRIP_ID)
                .eq('date', dateStr);

            if (existing && existing.length >= MAX_PHOTOS_PER_DAY) {
                alert(`每天最多上傳 ${MAX_PHOTOS_PER_DAY} 張照片`);
                return;
            }

            // 顯示上傳中狀態
            const addBtn = document.getElementById(`photo-add-btn-${dateStr}`);
            if (addBtn) { addBtn.innerHTML = `<span class="text-[10px] text-cyan-600 font-bold">上傳中...</span>`; }

            try {
                // 壓縮
                const compressed = await compressImage(file);
                const fileName = `${TRIP_ID}/${dateStr}_${Date.now()}.jpg`;

                // 上傳到 Storage
                const { error: uploadError } = await db.storage
                    .from('trip-photos')
                    .upload(fileName, compressed, { contentType: 'image/jpeg', upsert: false });

                if (uploadError) throw uploadError;

                // 取得公開 URL（使用 signed URL）
                const { data: urlData } = await db.storage
                    .from('trip-photos')
                    .createSignedUrl(fileName, 60 * 60 * 24 * 365);

                // 寫入資料庫
                const sortOrder = existing ? existing.length : 0;
                await db.from('trip_day_photos').insert({
                    trip_id: TRIP_ID,
                    date: dateStr,
                    photo_url: fileName,
                    sort_order: sortOrder
                });

                // 重新渲染照片區塊
                await refreshPhotoSection(dateStr);

            } catch (err) {
                console.error(err);
                alert('上傳失敗，請再試一次');
                await refreshPhotoSection(dateStr);
            }
        }

        // ============================================
        // 載入並渲染照片區塊
        // ============================================
        async function refreshPhotoSection(dateStr) {
            const { data: photos } = await db
                .from('trip_day_photos')
                .select('*')
                .eq('trip_id', TRIP_ID)
                .eq('date', dateStr)
                .order('sort_order', { ascending: true });

            const section = document.getElementById(`photo-section-${dateStr}`);
            if (!section) return;

            const count = photos ? photos.length : 0;
            const isOpen = section.classList.contains('open');

            section.outerHTML = buildPhotoSectionHtml(dateStr, photos || [], isOpen);
            bindPhotoSectionEvents(dateStr);
            lucide.createIcons();
        }

        function buildPhotoSectionHtml(dateStr, photos, defaultOpen = false) {
            const count = photos.length;
            const canAdd = count < MAX_PHOTOS_PER_DAY;

            const thumbsHtml = photos.map(p => {
                const { data: urlData } = db.storage.from('trip-photos').getPublicUrl(p.photo_url);
                const signedUrlPlaceholder = p.photo_url;
                return `
                    <button id="thumb-${p.id}" class="photo-thumb-btn relative flex-none w-[80px] h-[80px] rounded-2xl overflow-hidden border border-slate-200 bg-slate-100"
                        onclick="openPhotoOverlay('${p.id}', '${p.photo_url}')"
                        ontouchstart="startLongPress('${p.id}', '${p.photo_url}', this)"
                        ontouchend="cancelLongPress()"
                        ontouchmove="cancelLongPress()">
                        <img id="thumb-img-${p.id}" src="" class="w-full h-full object-cover" data-path="${p.photo_url}">
                    </button>`;
            }).join('');

            const addBtnHtml = canAdd ? `
                <button id="photo-add-btn-${dateStr}"
                    class="flex-none w-[80px] h-[80px] rounded-2xl border-2 border-dashed border-cyan-300 bg-cyan-50 flex flex-col items-center justify-center gap-1 active:scale-95 transition-all"
                    onclick="triggerPhotoUpload('${dateStr}')">
                    <i data-lucide="plus" class="w-5 h-5 text-cyan-500"></i>
                    <span class="text-[9px] text-cyan-500 font-bold">新增</span>
                </button>` : '';

            return `
                <div id="photo-section-${dateStr}" class="photo-section bg-white rounded-2xl border border-slate-100 shadow-sm mb-3 overflow-hidden ${defaultOpen ? 'open' : ''}">
                    <button class="w-full flex items-center justify-between px-4 py-3" onclick="togglePhotoSection('${dateStr}')">
                        <div class="flex items-center gap-2">
                            <div class="p-1.5 bg-emerald-50 rounded-lg">
                                <i data-lucide="camera" class="w-4 h-4 text-emerald-600"></i>
                            </div>
                            <span class="text-sm font-bold text-slate-700">今日照片</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${count > 0 ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-400'}">${count} / ${MAX_PHOTOS_PER_DAY}</span>
                        </div>
                        <i data-lucide="chevron-down" class="chevron-icon w-4 h-4 text-slate-400"></i>
                    </button>
                    <div class="photo-section-body">
                        <div class="px-4 pb-4">
                            <div class="flex gap-3 overflow-x-auto no-scrollbar py-1">
                                ${thumbsHtml}
                                ${addBtnHtml}
                            </div>
                            ${count > 0 ? '<p class="text-[10px] text-slate-400 mt-2 text-center">點擊照片可放大或刪除</p>' : ''}
                        </div>
                    </div>
                </div>`;
        }

        function bindPhotoSectionEvents(dateStr) {
            // 載入照片縮圖的 signed URL
            document.querySelectorAll(`#photo-section-${dateStr} img[data-path]`).forEach(async img => {
                const path = img.getAttribute('data-path');
                const { data } = await db.storage.from('trip-photos').createSignedUrl(path, 3600);
                if (data?.signedUrl) img.src = data.signedUrl;
            });
        }

        function togglePhotoSection(dateStr) {
            const section = document.getElementById(`photo-section-${dateStr}`);
            if (section) section.classList.toggle('open');
        }

        function triggerPhotoUpload(dateStr) {
            uploadingDate = dateStr;
            document.getElementById('photo-input').click();
        }

        // 長按刪除
        let longPressTimer = null;
        function startLongPress(photoId, photoPath, el) {
            el.classList.add('pressing');
            longPressTimer = setTimeout(() => {
                el.classList.remove('pressing');
                openPhotoOverlay(photoId, photoPath);

        function cancelLongPress() {
            clearTimeout(longPressTimer);
            document.querySelectorAll('.photo-thumb-btn.pressing').forEach(el => el.classList.remove('pressing'));

        // ============================================

        async function openPhotoOverlay(photoId, photoPath) {
            overlayPhotoId = photoId;
            overlayPhotoPath = photoPath;
            const overlay = document.getElementById('photo-overlay');
            const img = document.getElementById('overlay-img');
            img.src = '';
            overlay.classList.add('show');
            const { data } = await db.storage.from('trip-photos').createSignedUrl(photoPath, 3600);
            if (data?.signedUrl) img.src = data.signedUrl;
        }

        function closePhotoOverlay(event) {
            if (event && event.target !== document.getElementById('photo-overlay') && !event.target.classList.contains('photo-overlay-close')) return;
            document.getElementById('photo-overlay').classList.remove('show');
            overlayPhotoId = null;
            overlayPhotoPath = null;
        }

        async function deletePhotoFromOverlay() {
            if (!overlayPhotoId || !overlayPhotoPath) return;
            if (!confirm('確定要刪除這張照片嗎？')) return;

            // 從 storage 刪除
            await db.storage.from('trip-photos').remove([overlayPhotoPath]);

            // 從資料庫刪除
            const { data: photo } = await db.from('trip_day_photos').select('date').eq('id', overlayPhotoId).single();
            await db.from('trip_day_photos').delete().eq('id', overlayPhotoId);

            document.getElementById('photo-overlay').classList.remove('show');

            if (photo?.date) await refreshPhotoSection(photo.date);
            overlayPhotoId = null;
            overlayPhotoPath = null;
        }

        // ──────────────────────────────
        // 主渲染
        // ──────────────────────────────
        async function renderExpense() {
            showLoading();
            const container = document.getElementById('app-content');

            // 載入幣別
            if (!cache_currencies) {
                const { data } = await db.from('currencies').select('*').eq('trip_id', TRIP_ID).order('created_at');
                cache_currencies = data || [];
            }
            // 載入支出
            await refreshExpenses();

            container.innerHTML = buildExpensePageHtml();
            initExpenseSwipe();
            renderExpenseSlide();
            lucide.createIcons();
        }

        function buildExpensePageHtml() {
            return `
                <div class="pb-24">
                    <!-- Header -->
                    <div class="px-2 mb-4 flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-black text-slate-800 tracking-tight">旅遊記帳</h2>
                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">Expense Tracker</p>
                        </div>
                        <div class="flex gap-2" id="expense-header-btns">
                            <button onclick="toggleExpenseDeleteMode()" id="btn-expense-edit"
                                class="p-2 bg-white border border-slate-200 rounded-xl text-slate-400 active:scale-95 transition-all">
                                <i data-lucide="pencil" class="w-4 h-4"></i>
                            </button>
                            <button onclick="openExpenseSheet()"
                                class="p-2 bg-amber-500 rounded-xl text-white shadow-md shadow-amber-200 active:scale-95 transition-all">
                                <i data-lucide="plus" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Tab 列 -->
                    <div class="flex border-b border-slate-200 mb-4">
                        <button class="expense-tab-btn active" id="exp-tab-0" onclick="switchExpenseTab(0)">支出列表</button>
                        <button class="expense-tab-btn" id="exp-tab-1" onclick="switchExpenseTab(1)">統計圖表</button>
                    </div>

                    <!-- 滑動容器 -->
                    <div class="expense-slider-wrap" id="expense-slider-wrap">
                        <div class="expense-slider" id="expense-slider">
                            <!-- slide 0: 列表 -->
                            <div class="expense-slide" id="expense-slide-0">
                                <div id="expense-list-content"></div>
                            </div>
                            <!-- slide 1: 統計 -->
                            <div class="expense-slide" id="expense-slide-1">
                                <div id="expense-chart-content"></div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        // ──────────────────────────────
        // 重新載入 expenses
        // ──────────────────────────────
        async function refreshExpenses() {
            const { data } = await db
                .from('expenses')
                .select('*, currencies(code, name, rate_to_twd)')
                .eq('trip_id', TRIP_ID)
                .order('date', { ascending: true })
                .order('created_at', { ascending: true });
            cache_expenses = data || [];
        }

        // ──────────────────────────────
        // 渲染當前 slide 內容
        // ──────────────────────────────
        function renderExpenseSlide() {
            if (expenseSlideIndex === 0) renderExpenseList();
            else renderExpenseChart();
        }

        // ──────────────────────────────
        // 支出列表
        // ──────────────────────────────
        function renderExpenseList() {
            const el = document.getElementById('expense-list-content');
            if (!el) return;
            const expenses = cache_expenses || [];
            if (!expenses.length) {
                el.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-center">
                        <div class="text-5xl mb-4">💸</div>
                        <p class="text-slate-400 font-bold text-sm">還沒有支出紀錄</p>
                        <p class="text-slate-300 text-xs mt-1">點右上角 + 開始記帳</p>
                    </div>`;
                return;
            }

            // 依日期分組
            const grouped = {};
            expenses.forEach(e => {
                const d = e.date || '未指定日期';
                if (!grouped[d]) grouped[d] = [];
                grouped[d].push(e);
            });

            let html = '';
            Object.entries(grouped).sort(([a],[b]) => a > b ? 1 : -1).forEach(([date, items]) => {
                const dayTotal = items.reduce((s, e) => s + (Number(e.amount_twd) || Number(e.amount) || 0), 0);
                html += `
                    <div class="mb-4">
                        <div class="flex justify-between items-center px-1 mb-2">
                            <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${date !== '未指定日期' ? formatDate(date) : date}</span>
                            <span class="text-[10px] font-bold text-slate-400">≈ NT$ ${Math.round(dayTotal).toLocaleString()}</span>
                        </div>
                        <div class="space-y-2">
                            ${items.map(e => buildExpenseCard(e)).join('')}
                        </div>
                    </div>`;
            });
            el.innerHTML = html;
            lucide.createIcons();
        }

        function buildExpenseCard(e) {
            const cat = EXPENSE_CATS.find(c => c.key === e.category) || EXPENSE_CATS[5];
            const currCode = e.currencies?.code || 'NTD';
            const deleteBtn = expenseDeleteMode
                ? `<button onclick="deleteExpense('${e.id}')" class="flex-none w-8 h-8 bg-red-100 text-red-500 rounded-full flex items-center justify-center ml-2 active:scale-95">
                       <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                   </button>` : '';
            return `
                <div class="expense-card ${expenseDeleteMode ? 'delete-mode' : ''}" onclick="${expenseDeleteMode ? '' : `openExpenseSheet('${e.id}')`}">
                    <div class="expense-cat-badge" style="background:${cat.color}">
                        <span style="font-size:20px">${cat.emoji}</span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-slate-800 text-sm truncate">${e.name || '未命名'}</p>
                        <p class="text-[10px] text-slate-400 font-bold mt-0.5">${cat.key}</p>
                    </div>
                    <div class="text-right flex-none">
                        <p class="font-black text-slate-800 text-sm">${Number(e.amount).toLocaleString()}</p>
                        <p class="text-[10px] font-bold" style="color:${cat.text}">${currCode}</p>
                    </div>
                    ${deleteBtn}
                </div>`;
        }

        // ──────────────────────────────
        // 統計圖表（純 SVG 圓餅圖）
        // ──────────────────────────────
        let chartMode = 'category'; // 'category' | 'date'

        function renderExpenseChart() {
            const el = document.getElementById('expense-chart-content');
            if (!el) return;
            const expenses = cache_expenses || [];
            if (!expenses.length) {
                el.innerHTML = `<div class="flex flex-col items-center justify-center py-20 text-center">
                    <div class="text-5xl mb-4">📊</div>
                    <p class="text-slate-400 font-bold text-sm">還沒有支出資料</p></div>`;
                return;
            }

            // 切換按鈕
            const tabHtml = `
                <div class="flex bg-slate-100 p-1 rounded-2xl mb-5">
                    <button onclick="setChartMode('category')" id="chart-tab-cat"
                        class="flex-1 py-2 text-xs font-bold rounded-xl transition-all ${chartMode==='category' ? 'bg-white text-cyan-600 shadow-sm' : 'text-slate-400'}">
                        依分類
                    </button>
                    <button onclick="setChartMode('date')" id="chart-tab-date"
                        class="flex-1 py-2 text-xs font-bold rounded-xl transition-all ${chartMode==='date' ? 'bg-white text-cyan-600 shadow-sm' : 'text-slate-400'}">
                        依日期
                    </button>
                </div>`;

            // 彙總資料（統一換算台幣）
            const groups = {};
            expenses.forEach(e => {
                const rate = e.currencies?.rate_to_twd ?? 1;
                const amtTwd = Number(e.amount) * rate;
                const key = chartMode === 'category' ? (e.category || '其他') : (e.date || '未知');
                groups[key] = (groups[key] || 0) + amtTwd;
            });

            const entries = Object.entries(groups).sort((a,b) => b[1]-a[1]);
            const total = entries.reduce((s,[,v]) => s+v, 0);
            const n = entries.length;

            // HSL 動態配色：均勻分布色相，固定飽和度和亮度，顏色鮮明不暗沉
            function getPieColor(i, total) {
                const hue = Math.round((i * 360) / total) % 360;
                return `hsl(${hue}, 72%, 52%)`;
            }

            // SVG 圓餅圖（加入點擊互動）
            const cx = 110, cy = 110, r = 90;
            let startAngle = -Math.PI / 2;
            let paths = '';
            entries.forEach(([label, val], i) => {
                const angle = (val / total) * 2 * Math.PI;
                const endAngle = startAngle + angle;
                const x1 = cx + r * Math.cos(startAngle);
                const y1 = cy + r * Math.sin(startAngle);
                const x2 = cx + r * Math.cos(endAngle);
                const y2 = cy + r * Math.sin(endAngle);
                const largeArc = angle > Math.PI ? 1 : 0;
                const color = getPieColor(i, n);
                const pct = ((val / total) * 100).toFixed(1);
                const emoji = chartMode === 'category'
                    ? (EXPENSE_CATS.find(c=>c.key===label)?.emoji || '📦') : '📅';
                const displayLabel = chartMode === 'date' && label !== '未知' ? formatDate(label) : label;
                // data 屬性傳給 onclick
                paths += `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc},1 ${x2},${y2} Z"
                    fill="${color}" class="pie-segment" opacity="0.9"
                    data-label="${displayLabel}" data-emoji="${emoji}"
                    data-val="${Math.round(val)}" data-pct="${pct}"
                    onclick="onPieClick(this, '${color}')"/>`;
                startAngle = endAngle;
            });

            const svgHtml = `
                <div class="flex justify-center mb-4">
                    <svg id="pie-svg" width="220" height="220" viewBox="0 0 220 220" onclick="onPieBgClick(event)">
                        ${paths}
                        <circle cx="${cx}" cy="${cy}" r="52" fill="white" style="pointer-events:none"/>
                        <text id="pie-center-sub" x="${cx}" y="${cy - 8}" text-anchor="middle" font-size="11" fill="#94a3b8" font-weight="700" style="pointer-events:none">總計(台幣)</text>
                        <text id="pie-center-main" x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="900" style="pointer-events:none">
                            NT$ ${Math.round(total).toLocaleString()}
                        </text>
                        <text id="pie-center-pct" x="${cx}" y="${cy + 30}" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="700" style="pointer-events:none"></text>
                    </svg>
                </div>`;

            // 明細列表（色塊用同一套 HSL）
            const listHtml = entries.map(([label, val], i) => {
                const pct = ((val / total) * 100).toFixed(1);
                const color = getPieColor(i, n);
                const emoji = chartMode === 'category'
                    ? (EXPENSE_CATS.find(c=>c.key===label)?.emoji || '📦') : '📅';
                const displayLabel = chartMode === 'date' && label !== '未知' ? formatDate(label) : label;
                return `
                    <div class="stat-row">
                        <div class="flex items-center gap-3">
                            <span class="w-3 h-3 rounded-full flex-none" style="background:${color}"></span>
                            <span class="text-sm font-bold text-slate-700">${emoji} ${displayLabel}</span>
                        </div>
                        <div class="text-right">
                            <p class="text-sm font-black text-slate-800">NT$ ${Math.round(val).toLocaleString()}</p>
                            <p class="text-[10px] text-slate-400 font-bold">${pct}%</p>
                        </div>
                    </div>`;
            }).join('');

            el.innerHTML = `
                ${tabHtml}
                ${svgHtml}
                <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-4">
                    <div class="flex justify-between items-center mb-3">
                        <p class="text-xs font-black text-slate-500">明細分類</p>
                        <p class="text-[10px] font-bold text-slate-300">統計幣別：NTD</p>
                    </div>
                    ${listHtml}
                </div>`;
        }

        function setChartMode(mode) {
            chartMode = mode;
            renderExpenseChart();
        }
        function onPieClick(path, color) {
            // 所有扇形恢復
            document.querySelectorAll('.pie-segment').forEach(p => p.setAttribute('opacity','0.9'));
            // 點擊的扇形高亮
            path.setAttribute('opacity','1');
            // 其他變淡
            document.querySelectorAll('.pie-segment').forEach(p => {
                if (p !== path) p.setAttribute('opacity','0.35');
            });
            const label = path.getAttribute('data-label');
            const emoji = path.getAttribute('data-emoji');
            const val = path.getAttribute('data-val');
            const pct = path.getAttribute('data-pct');
            const sub = document.getElementById('pie-center-sub');
            const main = document.getElementById('pie-center-main');
            const pctEl = document.getElementById('pie-center-pct');
            if (sub) sub.textContent = `${emoji} ${label}`;
            if (main) { main.textContent = `NT$ ${Number(val).toLocaleString()}`; main.setAttribute('fill', color); }
            if (pctEl) pctEl.textContent = `${pct}%`;
        }

        // 點擊空白處：恢復預設
        function onPieBgClick(e) {
            if (e.target.classList.contains('pie-segment')) return;
            document.querySelectorAll('.pie-segment').forEach(p => p.setAttribute('opacity','0.9'));
            const sub = document.getElementById('pie-center-sub');
            const main = document.getElementById('pie-center-main');
            const pctEl = document.getElementById('pie-center-pct');
            const expenses = cache_expenses || [];
            const total = expenses.reduce((s,e) => {
                const rate = e.currencies?.rate_to_twd ?? 1;
                return s + Number(e.amount) * rate;
            }, 0);
            if (sub) sub.textContent = '總計(台幣)';
            if (main) { main.textContent = `NT$ ${Math.round(total).toLocaleString()}`; main.setAttribute('fill','#0f172a'); }
            if (pctEl) pctEl.textContent = '';
        }

        // ──────────────────────────────
        // Tab 切換
        // ──────────────────────────────
        function switchExpenseTab(idx) {
            expenseSlideIndex = idx;
            const slider = document.getElementById('expense-slider');
            if (slider) slider.style.transform = `translateX(-${idx * 100}%)`;
            [0,1].forEach(i => {
                const btn = document.getElementById(`exp-tab-${i}`);
                if (btn) btn.classList.toggle('active', i === idx);
            });
            renderExpenseSlide();

            // 統計頁隱藏右上角按鈕
            const headerBtns = document.getElementById('expense-header-btns');
            if (headerBtns) headerBtns.style.display = idx === 0 ? 'flex' : 'none';
        }

        // ──────────────────────────────
        // 滑動手勢
        // ──────────────────────────────
        function initExpenseSwipe() {
            const wrap = document.getElementById('expense-slider-wrap');
            if (!wrap) return;
            wrap.addEventListener('touchstart', e => {
                expenseSwipeStartX = e.touches[0].clientX;
                expenseSwipeStartY = e.touches[0].clientY;
            }, { passive: true });
            wrap.addEventListener('touchend', e => {
                const dx = e.changedTouches[0].clientX - expenseSwipeStartX;
                const dy = e.changedTouches[0].clientY - expenseSwipeStartY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
                    if (dx < 0 && expenseSlideIndex === 0) switchExpenseTab(1);
                    else if (dx > 0 && expenseSlideIndex === 1) switchExpenseTab(0);
                }
            }, { passive: true });
        }

        // ──────────────────────────────
        // 批次刪除模式
        // ──────────────────────────────
        function toggleExpenseDeleteMode() {
            expenseDeleteMode = !expenseDeleteMode;
            const btn = document.getElementById('btn-expense-edit');
            if (btn) {
                btn.classList.toggle('bg-red-100', expenseDeleteMode);
                btn.classList.toggle('text-red-500', expenseDeleteMode);
                btn.classList.toggle('border-red-200', expenseDeleteMode);
                btn.classList.toggle('text-slate-400', !expenseDeleteMode);
            }
            renderExpenseList();
            lucide.createIcons();
        }

        async function deleteExpense(id) {
            if (!confirm('確定要刪除這筆支出嗎？')) return;
            await db.from('expenses').delete().eq('id', id);
            await refreshExpenses();
            renderExpenseList();
        }

        // ──────────────────────────────
        // Sheet 開關
        // ──────────────────────────────
        function openExpenseSheet(editId = null) {
            expenseEditId = editId;
            expenseDeleteMode = false;

            // 重設 sheet UI
            document.getElementById('sheet-title').textContent = editId ? '編輯支出' : '新增支出';
            document.getElementById('sheet-name').value = '';
            document.getElementById('sheet-amount').value = '';
            document.getElementById('sheet-error').classList.add('hidden');

            // 預設日期為今天
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('sheet-date').value = today;

            // 分類選擇器
            selectedCat = '餐飲';
            renderCatSelector();

            // 幣別下拉
            const currEl = document.getElementById('sheet-currency');
            currEl.innerHTML = (cache_currencies || []).map(c =>
                `<option value="${c.id}" ${c.is_default ? 'selected' : ''}>${c.code}</option>`
            ).join('');

            // 若是編輯，帶入原始資料
            if (editId) {
                const e = (cache_expenses || []).find(x => x.id === editId);
                if (e) {
                    document.getElementById('sheet-name').value = e.name || '';
                    document.getElementById('sheet-amount').value = e.amount || '';
                    document.getElementById('sheet-date').value = e.date || today;
                    selectedCat = e.category || '餐飲';
                    renderCatSelector();
                    if (e.currency_id) currEl.value = e.currency_id;
                }
            }

            document.getElementById('expense-sheet-overlay').classList.add('show');
            document.getElementById('expense-sheet').classList.add('show');
        }

        function closeExpenseSheet() {
            document.getElementById('expense-sheet-overlay').classList.remove('show');
            document.getElementById('expense-sheet').classList.remove('show');
        }

        function renderCatSelector() {
            const el = document.getElementById('cat-selector');
            if (!el) return;
            el.innerHTML = EXPENSE_CATS.map(c => `
                <button class="cat-btn ${selectedCat === c.key ? 'selected' : ''}" onclick="selectCat('${c.key}')">
                    <span style="font-size:22px">${c.emoji}</span>
                    <span>${c.key}</span>
                </button>`).join('');
        }

        function selectCat(key) {
            selectedCat = key;
            renderCatSelector();
        }

        // ──────────────────────────────
        // 儲存支出
        // ──────────────────────────────
        async function submitExpense() {
            const name = document.getElementById('sheet-name').value.trim();
            const amount = parseFloat(document.getElementById('sheet-amount').value);
            const date = document.getElementById('sheet-date').value;
            const currencyId = document.getElementById('sheet-currency').value;
            const errEl = document.getElementById('sheet-error');

            errEl.classList.add('hidden');
            if (!name) { errEl.textContent = '請輸入名稱'; errEl.classList.remove('hidden'); return; }
            if (!amount || isNaN(amount) || amount <= 0) { errEl.textContent = '請輸入有效金額'; errEl.classList.remove('hidden'); return; }

            const btn = document.getElementById('sheet-submit-btn');
            btn.disabled = true; btn.textContent = '儲存中...';

            // 計算 amount_twd
            const curr = (cache_currencies || []).find(c => c.id === currencyId);
            const rate = curr?.rate_to_twd ?? 1;
            const amount_twd = amount * rate;

            if (expenseEditId) {
                await db.from('expenses').update({
                    category: selectedCat, name, amount, currency_id: currencyId,
                    date: date || null, amount_twd
                }).eq('id', expenseEditId);
            } else {
                await db.from('expenses').insert({
                    trip_id: TRIP_ID, category: selectedCat, name,
                    amount, currency_id: currencyId,
                    date: date || null, amount_twd
                });
            }

            btn.disabled = false; btn.textContent = '儲存';
            closeExpenseSheet();
            await refreshExpenses();
            renderExpenseList();
        }

        // ============================================
        // 啟動
        // ============================================
        window.onload = async () => {
            const { data } = await db.auth.getSession();
            if (!data.session) { window.location.href = 'login.html'; return; }
            currentUser = data.session.user;
            if (!TRIP_ID) {
                document.getElementById('app-content').innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 text-center">
                        <i data-lucide="alert-circle" class="w-12 h-12 text-slate-300 mb-4"></i>
                        <p class="text-slate-500 font-bold text-sm">找不到行程 ID</p>
                        <a href="index.html" class="mt-4 px-4 py-2 bg-cyan-600 text-white rounded-xl text-xs font-bold">回首頁</a>
                    </div>`;
                lucide.createIcons();
                return;
            }
            router('home');
        };
    </script>
</body>
</html>
