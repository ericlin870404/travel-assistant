<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>旅遊助手 - 行程詳情</title>
    <link rel="manifest" href="manifest.json?v=0318">
    <meta name="theme-color" content="#0891b2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
    <!-- Google Maps JavaScript API (僅供 place_id → Maps 連結用，不需 Places library) -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB-Di-wOf1--3cVcGO9-hXrJ_L6B2YSea8&language=zh-TW" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .active-nav { color: #0891b2; border-top: 3px solid #0891b2; }
        .active-food-tab { background-color: #0891b2 !important; color: white !important; }
        .glass-header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .expand-content { max-height: 0; overflow: hidden; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; }
        .expanded .expand-content { max-height: 1200px; opacity: 1; }
        .loading-shimmer {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 1rem;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* 照片區塊 */
        .photo-section { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .photo-section-body { overflow: hidden; transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); max-height: 0; opacity: 0; }
        .photo-section.open .photo-section-body { max-height: 300px; opacity: 1; }
        .photo-section .chevron-icon { transition: transform 0.3s; }
        .photo-section.open .chevron-icon { transform: rotate(180deg); }

        /* 照片縮圖長按效果 */
        .photo-thumb-btn { transition: transform 0.15s, opacity 0.15s; }
        .photo-thumb-btn.pressing { transform: scale(0.92); opacity: 0.7; }

        /* 放大預覽遮罩 */
        .photo-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            z-index: 200; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .photo-overlay.show { opacity: 1; pointer-events: all; }
        .photo-overlay img { max-width: 92vw; max-height: 80vh; border-radius: 12px; object-fit: contain; }
        .photo-overlay-close {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255,255,255,0.15); border: none;
            color: white; border-radius: 50%; width: 36px; height: 36px;
            font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .photo-overlay-delete {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(239,68,68,0.85); color: white; border: none;
            padding: 10px 28px; border-radius: 20px; font-size: 13px; font-weight: 700;
            cursor: pointer;
        }

        /* ── 記帳模組 ── */
        /* 左右滑動容器 */
        .expense-slider-wrap {
            overflow: hidden; position: relative;
        }
        .expense-slider {
            display: flex; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }
        .expense-slide {
            flex: 0 0 100%; min-width: 0;
        }

        /* Tab 指示器 */
        .expense-tab-btn {
            flex: 1; padding: 8px 0; font-size: 12px; font-weight: 800;
            border-bottom: 2px solid transparent; transition: all 0.2s; color: #94a3b8;
        }
        .expense-tab-btn.active { color: #0891b2; border-color: #0891b2; }

        /* 支出卡片 */
        .expense-card {
            background: white; border-radius: 20px;
            border: 1px solid #f1f5f9; transition: all 0.15s;
            display: flex; align-items: center; padding: 14px 16px; gap: 14px;
        }
        .expense-card.delete-mode { border-color: #fecaca; }
        .expense-cat-badge {
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; flex-none;
        }

        /* 底部 Sheet */
        .expense-sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .expense-sheet-overlay.show { opacity: 1; pointer-events: all; }
        .expense-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-radius: 28px 28px 0 0;
            padding: 0 20px 40px; z-index: 301;
            transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90vh; overflow-y: auto;
        }
        .expense-sheet.show { transform: translateY(0); }
        .sheet-handle {
            width: 36px; height: 4px; background: #e2e8f0;
            border-radius: 2px; margin: 12px auto 20px;
        }
        .sheet-input {
            width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0;
            border-radius: 14px; font-size: 14px; font-family: inherit;
            outline: none; transition: border-color 0.2s; background: #f8fafc;
            -webkit-appearance: none;
        }
        .sheet-input:focus { border-color: #0891b2; background: white; }
        .cat-selector {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        }
        .cat-btn {
            padding: 10px 6px; border-radius: 14px; border: 1.5px solid #e2e8f0;
            background: #f8fafc; display: flex; flex-direction: column;
            align-items: center; gap: 4px; font-size: 20px; transition: all 0.15s;
            cursor: pointer;
        }
        .cat-btn.selected { border-color: #0891b2; background: #ecfeff; }
        .cat-btn span { font-size: 10px; font-weight: 800; color: #64748b; }
        .cat-btn.selected span { color: #0891b2; }

        /* 圓餅圖 */
        .pie-segment { transition: opacity 0.2s; cursor: pointer; }
        .pie-segment:hover { opacity: 0.85; }

        /* 統計列表 */
        .stat-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid #f1f5f9;
        }
        .stat-row:last-child { border-bottom: none; }

        /* ── 行程 Sheet ── */
        .schedule-sheet-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .schedule-sheet-overlay.show { opacity: 1; pointer-events: all; }
        .schedule-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; border-radius: 28px 28px 0 0;
            padding: 0 20px 40px; z-index: 301;
            transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90vh; overflow-y: auto;
        }
        .schedule-sheet.show { transform: translateY(0); }

        /* ── 刪除確認 Modal ── */
        .delete-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 400; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .delete-modal-overlay.show { opacity: 1; pointer-events: all; }
        .delete-modal {
            background: white; border-radius: 24px;
            padding: 28px 24px; width: calc(100% - 48px); max-width: 340px;
            transform: scale(0.92); transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .delete-modal-overlay.show .delete-modal { transform: scale(1); }

        /* 活動卡片點擊提示 */
        .schedule-item-card { cursor: pointer; }
        .schedule-item-card:active { transform: scale(0.98); opacity: 0.85; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <!-- 照片放大預覽 -->
    <div id="photo-overlay" class="photo-overlay" onclick="closePhotoOverlay(event)">
        <button class="photo-overlay-close" onclick="closePhotoOverlay()">✕</button>
        <!-- 左箭頭 -->
        <button id="overlay-prev" onclick="navigatePhoto(-1)" style="position:fixed;left:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;color:white;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity 0.2s;">‹</button>
        <img id="overlay-img" src="" alt="">
        <!-- 右箭頭 -->
        <button id="overlay-next" onclick="navigatePhoto(1)" style="position:fixed;right:16px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.15);border:none;color:white;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity 0.2s;">›</button>
        <!-- 張數指示 -->
        <p id="overlay-counter" style="position:fixed;top:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.7);font-size:12px;font-weight:700;"></p>
        <button class="photo-overlay-delete" id="overlay-delete-btn" onclick="deletePhotoFromOverlay()">刪除照片</button>
    </div>

    <header class="glass-header text-white p-6 sticky top-0 z-50 shadow-xl">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <div class="flex items-center">
                <button onclick="handleHomeClick()" class="flex items-center gap-1 text-cyan-400 focus:outline-none">
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                    <span class="font-bold text-sm">Home</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 行程 Sheet overlay -->
    <div id="schedule-sheet-overlay" class="schedule-sheet-overlay" onclick="closeScheduleSheet()"></div>
    <div id="schedule-sheet" class="schedule-sheet">
        <div class="sheet-handle"></div>
        <h3 id="sched-sheet-title" class="text-lg font-black text-slate-800 mb-1">新增活動</h3>
        <p id="sched-sheet-date-label" class="text-[11px] text-cyan-600 font-bold mb-5"></p>
        <div class="mb-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">活動名稱 <span class="text-red-400">*</span></label>
            <div class="relative">
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-slate-400 pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    </span>
                    <input id="sched-name" type="text" placeholder="輸入活動名稱搜尋…" class="sheet-input pl-9 pr-9" maxlength="15" autocomplete="off">
                    <button id="sched-name-clear" onclick="clearPlaceSearch('sched')" class="absolute right-3 text-slate-300 hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div id="sched-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden z-50 max-h-52 overflow-y-auto">
                    <div id="sched-suggestions-list"></div>
                </div>
            </div>
            <div id="sched-place-preview" class="hidden mt-2 flex items-center gap-2 bg-cyan-50 border border-cyan-200 rounded-2xl px-3.5 py-2.5">
                <span class="text-cyan-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                </span>
                <span id="sched-place-preview-name" class="text-xs font-bold text-cyan-700 flex-1 truncate"></span>
                <button onclick="clearPlaceSearch('sched')" class="text-cyan-400 hover:text-cyan-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>
        <div class="mb-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">時間 <span class="text-red-400">*</span></label>
            <input id="sched-time" type="time" class="sheet-input">
        </div>
        <div class="mb-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">地圖連結</label>
            <div class="relative flex items-center">
                <input id="sched-map-url" type="url" placeholder="選擇地點後自動填入，或手動貼上" class="sheet-input pr-10">
                <span id="sched-map-indicator" class="absolute right-3.5 hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-cyan-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </span>
            </div>
            <p class="text-[10px] text-slate-300 mt-1.5 px-1">選擇搜尋結果即自動帶入 Google Maps 連結</p>
        </div>
        <div class="mb-6">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">備註</label>
            <textarea id="sched-notes" placeholder="補充說明、提醒事項..." class="sheet-input resize-none" rows="3" maxlength="40"></textarea>
        </div>
        <div id="sched-sheet-error" class="text-red-500 text-xs font-bold mb-3 hidden"></div>
        <button id="sched-submit-btn" onclick="submitScheduleItem()" class="w-full bg-cyan-600 text-white py-4 rounded-2xl font-black text-sm active:scale-95 transition-all shadow-lg shadow-cyan-100 mb-3">儲存</button>
        <button id="sched-delete-btn" onclick="openDeleteModal(confirmDeleteScheduleItem)" class="w-full hidden bg-red-50 text-red-500 border border-red-200 py-3.5 rounded-2xl font-black text-sm active:scale-95 transition-all">刪除這筆活動</button>
    </div>

    <!-- 刪除確認 Modal -->
    <div id="delete-modal-overlay" class="delete-modal-overlay">
        <div class="delete-modal">
            <div class="flex items-center gap-3 mb-3">
                <div class="p-2 bg-red-50 rounded-xl">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                    </svg>
                </div>
                <h4 class="font-black text-slate-800 text-base">確認刪除？</h4>
            </div>
            <p class="text-sm text-slate-500 mb-6 leading-relaxed">刪除後無法復原，確定要刪除這筆活動嗎？</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 py-3.5 rounded-2xl border border-slate-200 text-slate-600 font-black text-sm active:scale-95 transition-all">取消</button>
                <button onclick="confirmDelete()" class="flex-1 py-3.5 rounded-2xl bg-red-500 text-white font-black text-sm active:scale-95 transition-all shadow-lg shadow-red-100">確認刪除</button>
            </div>
        </div>
    </div>

    <!-- 住宿 Sheet overlay -->
    <div id="hotel-sheet-overlay" class="schedule-sheet-overlay" onclick="closeHotelSheet()"></div>
    <div id="hotel-sheet" class="schedule-sheet">
        <div class="sheet-handle"></div>
        <h3 id="hotel-sheet-title" class="text-lg font-black text-slate-800 mb-5">新增住宿</h3>
        <div class="mb-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">住宿日期 <span class="text-red-400">*</span></label>
            <input id="hotel-date" type="date" class="sheet-input">
        </div>
        <div class="mb-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">飯店名稱 <span class="text-red-400">*</span></label>
            <div class="relative">
                <div class="relative flex items-center">
                    <span class="absolute left-3.5 text-slate-400 pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    </span>
                    <input id="hotel-name" type="text" placeholder="輸入飯店名稱搜尋…" class="sheet-input pl-9 pr-9" maxlength="30" autocomplete="off">
                    <button id="hotel-name-clear" onclick="clearPlaceSearch('hotel')" class="absolute right-3 text-slate-300 hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
                <div id="hotel-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden z-50 max-h-52 overflow-y-auto">
                    <div id="hotel-suggestions-list"></div>
                </div>
            </div>
            <div id="hotel-place-preview" class="hidden mt-2 flex items-center gap-2 bg-cyan-50 border border-cyan-200 rounded-2xl px-3.5 py-2.5">
                <span class="text-cyan-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                </span>
                <span id="hotel-place-preview-name" class="text-xs font-bold text-cyan-700 flex-1 truncate"></span>
                <button onclick="clearPlaceSearch('hotel')" class="text-cyan-400 hover:text-cyan-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
        </div>
        <div class="mb-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">房型</label>
            <input id="hotel-room-type" type="text" placeholder="例：雙人房、和室房" class="sheet-input" maxlength="20">
        </div>
        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Check In</label>
                <input id="hotel-checkin" type="time" class="sheet-input">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Check Out</label>
                <input id="hotel-checkout" type="time" class="sheet-input">
            </div>
        </div>
        <div class="mb-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">早餐</label>
            <div class="flex gap-2">
                <button id="hotel-breakfast-yes" onclick="setHotelBreakfast(true)" class="flex-1 py-2.5 rounded-2xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-500 transition-all">含早餐</button>
                <button id="hotel-breakfast-no" onclick="setHotelBreakfast(false)" class="flex-1 py-2.5 rounded-2xl text-xs font-bold border border-slate-800 bg-slate-800 text-white transition-all">不含早餐</button>
            </div>
        </div>
        <div class="mb-4">
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">地圖連結</label>
            <div class="relative flex items-center">
                <input id="hotel-map-url" type="url" placeholder="選擇地點後自動填入，或手動貼上" class="sheet-input pr-10">
                <span id="hotel-map-indicator" class="absolute right-3.5 hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-cyan-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>

        // ============================================

        // ============================================
        function compressImage(file, maxSizeMB = 1) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let { width, height } = img;
                        const maxPx = 1600;
                        if (width > maxPx || height > maxPx) {
                            if (width > height) { height = Math.round(height * maxPx / width); width = maxPx; }
                            else { width = Math.round(width * maxPx / height); height = maxPx; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        let quality = 0.85;
                        const tryCompress = () => {
                            canvas.toBlob((blob) => {
                                if (blob.size <= maxSizeMB * 1024 * 1024 || quality <= 0.3) {
                                    resolve(blob);
                                } else {
                                    quality -= 0.1;
                                    tryCompress();
                                }
                            }, 'image/jpeg', quality);
                        };
                        tryCompress();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // ============================================
        // 照片上傳處理
        // ============================================
        async function handlePhotoSelected(event) {
            const file = event.target.files[0];
            if (!file || !uploadingDate) return;
            event.target.value = '';

            const dateStr = uploadingDate;
            const photoSection = document.getElementById(`photo-section-${dateStr}`);

            if (existing && existing.length >= MAX_PHOTOS_PER_DAY) {
                alert(`每天最多上傳 ${MAX_PHOTOS_PER_DAY} 張照片`);
                return;
            }

            // 顯示上傳中狀態
            const addBtn = document.getElementById(`photo-add-btn-${dateStr}`);
            if (addBtn) { addBtn.innerHTML = `<span class="text-[10px] text-cyan-600 font-bold">上傳中...</span>`; }

            try {
                // 壓縮
                const compressed = await compressImage(file);
                const fileName = `${TRIP_ID}/${dateStr}_${Date.now()}.jpg`;

                // 上傳到 Storage
                const { error: uploadError } = await db.storage
                    .from('trip-photos')
                    .upload(fileName, compressed, { contentType: 'image/jpeg', upsert: false });

                if (uploadError) throw uploadError;

                // 取得公開 URL（使用 signed URL）
                const { data: urlData } = await db.storage
                    .from('trip-photos')
                    .createSignedUrl(fileName, 60 * 60 * 24 * 365);

                // 寫入資料庫
                const sortOrder = existing ? existing.length : 0;
                await db.from('trip_day_photos').insert({
                    trip_id: TRIP_ID,
                    date: dateStr,
                    photo_url: fileName,
                    sort_order: sortOrder
                });

                // 重新渲染照片區塊
                await refreshPhotoSection(dateStr);

            } catch (err) {
                console.error(err);
                alert('上傳失敗，請再試一次');
                await refreshPhotoSection(dateStr);
            }
        }

        // ============================================
        // 載入並渲染照片區塊
        // ============================================
        async function refreshPhotoSection(dateStr) {
            const { data: photos } = await db
                .from('trip_day_photos')
                .select('*')
                .eq('trip_id', TRIP_ID)
                .eq('date', dateStr)
                .order('sort_order', { ascending: true });

            const section = document.getElementById(`photo-section-${dateStr}`);
            if (!section) return;

            const count = photos ? photos.length : 0;
            const isOpen = section.classList.contains('open');

            section.outerHTML = buildPhotoSectionHtml(dateStr, photos || [], isOpen);
            bindPhotoSectionEvents(dateStr);
            lucide.createIcons();
        }

        function buildPhotoSectionHtml(dateStr, photos, defaultOpen = false) {
            const count = photos.length;
            const canAdd = count < MAX_PHOTOS_PER_DAY;

            const thumbsHtml = photos.map(p => {
                const { data: urlData } = db.storage.from('trip-photos').getPublicUrl(p.photo_url);

                        ontouchend="cancelLongPress()"
                        ontouchmove="cancelLongPress()">
                        <img id="thumb-img-${p.id}" src="" class="w-full h-full object-cover" data-path="${p.photo_url}">
                    </button>`;
            }).join('');

            const addBtnHtml = canAdd ? `
                <button id="photo-add-btn-${dateStr}"
                    class="flex-none w-[80px] h-[80px] rounded-2xl border-2 border-dashed border-cyan-300 bg-cyan-50 flex flex-col items-center justify-center gap-1 active:scale-95 transition-all"

            return `

                        </div>
                    </div>
                </div>`;
        }

        function bindPhotoSectionEvents(dateStr) {
            // 載入照片縮圖的 signed URL
            document.querySelectorAll(`#photo-section-${dateStr} img[data-path]`).forEach(async img => {
                const path = img.getAttribute('data-path');

        // 長按刪除
        let longPressTimer = null;
        function startLongPress(photoId, photoPath, el) {
            el.classList.add('pressing');
            longPressTimer = setTimeout(() => {
                el.classList.remove('pressing');

            clearTimeout(longPressTimer);
            document.querySelectorAll('.photo-thumb-btn.pressing').forEach(el => el.classList.remove('pressing'));
        }

        // 照片放大預覽 & 刪除
        // ============================================
        let overlayPhotos = [];      // 當前日期所有照片 [{id, photo_url}]

        let overlaySwipeStartX = 0;

        async function openPhotoOverlay(photoId, photoPath) {
            // 從縮圖列表收集當天所有照片順序
            const thumbs = document.querySelectorAll('.photo-thumb-btn');
            overlayPhotos = Array.from(thumbs).map(btn => ({
                id: btn.id.replace('thumb-', ''),
                path: btn.querySelector('img')?.getAttribute('data-path') || ''

            overlayIndex = overlayPhotos.findIndex(p => p.id === photoId);
            if (overlayIndex === -1) overlayIndex = 0;

            const overlay = document.getElementById('photo-overlay');
            overlay.classList.add('show');
            await loadOverlayPhoto();
            bindOverlaySwipe();
        }

        async function loadOverlayPhoto() {
            const photo = overlayPhotos[overlayIndex];
            if (!photo) return;

            overlayPhotoId = photo.id;
            overlayPhotoPath = photo.path;

            const img = document.getElementById('overlay-img');
            img.src = '';
            const { data } = await db.storage.from('trip-photos').createSignedUrl(photo.path, 3600);
            if (data?.signedUrl) img.src = data.signedUrl;

            // 更新張數
            const counter = document.getElementById('overlay-counter');
            if (counter) counter.textContent = `${overlayIndex + 1} / ${overlayPhotos.length}`;

            // 更新箭頭狀態
            const prev = document.getElementById('overlay-prev');
            const next = document.getElementById('overlay-next');
            if (prev) prev.style.opacity = overlayIndex === 0 ? '0.2' : '1';
            if (next) next.style.opacity = overlayIndex === overlayPhotos.length - 1 ? '0.2' : '1';
            if (prev) prev.style.pointerEvents = overlayIndex === 0 ? 'none' : 'auto';
            if (next) next.style.pointerEvents = overlayIndex === overlayPhotos.length - 1 ? 'none' : 'auto';
        }

        function navigatePhoto(dir) {
            const newIndex = overlayIndex + dir;
            if (newIndex < 0 || newIndex >= overlayPhotos.length) return;
            overlayIndex = newIndex;
            loadOverlayPhoto();
        }

        let overlaySwipeBound = false;
        function bindOverlaySwipe() {
            if (overlaySwipeBound) return;
            overlaySwipeBound = true;
            const overlay = document.getElementById('photo-overlay');
            overlay.addEventListener('touchstart', e => {
                overlaySwipeStartX = e.touches[0].clientX;
            }, { passive: true });
            overlay.addEventListener('touchend', e => {
                const dx = e.changedTouches[0].clientX - overlaySwipeStartX;
                if (Math.abs(dx) > 50) navigatePhoto(dx < 0 ? 1 : -1);
            }, { passive: true });
        }

        function closePhotoOverlay(event) {
            if (event && event.target !== document.getElementById('photo-overlay') && !event.target.classList.contains('photo-overlay-close')) return;

            overlayPhotoId = null;
            overlayPhotoPath = null;
            overlayPhotos = [];

            await db.storage.from('trip-photos').remove([overlayPhotoPath]);
            const { data: photo } = await db.from('trip_day_photos').select('date').eq('id', overlayPhotoId).single();

            document.getElementById('photo-overlay').classList.remove('show');
            overlayPhotoId = null;
            overlayPhotoPath = null;
            overlayPhotos = [];

            if (photo?.date) await refreshPhotoSection(photo.date);

            // 根據起訖日期產生每天日期陣列（避免時區問題，直接用字串計算）

        // 從 trip 起訖日期產生日期陣列（避免時區問題）
        function getTripDays() {
            const days = [];
            const sp = cache.trip.start_date.split('-').map(Number);
            const ep = cache.trip.end_date.split('-').map(Number);
            const startD = new Date(sp[0], sp[1] - 1, sp[2]);
            const endD = new Date(ep[0], ep[1] - 1, ep[2]);
            for (let d = new Date(startD); d <= endD; d.setDate(d.getDate() + 1)) {
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                days.push(`${y}-${m}-${day}`);
            }
            return days;
        }

                const item = allItems.find(i => i.id === editId);

        async function submitScheduleItem() {
            const title = document.getElementById('sched-name').value.trim();
            const time = document.getElementById('sched-time').value;
            const map_url = document.getElementById('sched-map-url').value.trim();
            const notes = document.getElementById('sched-notes').value.trim();
            const errEl = document.getElementById('sched-sheet-error');

            errEl.classList.add('hidden');
            if (!title) {
                errEl.textContent = '請輸入活動名稱';
                errEl.classList.remove('hidden');
                return;
            }
            if (!time) {
                errEl.textContent = '請選擇活動時間';
                errEl.classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('sched-submit-btn');
            btn.disabled = true;
            btn.textContent = '儲存中...';

            const days = getTripDays();
            const currentDateStr = days[activeScheduleDay];

            if (scheduleEditId) {
                // 更新
                const { error } = await db.from('schedule_items').update({
                    title,
                    time: time || null,
                    map_url: map_url || null,
                    notes: notes || null
                }).eq('id', scheduleEditId);

                if (error) {
                    errEl.textContent = '儲存失敗，請再試一次';
                    errEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = '儲存';
                    return;
                }
            } else {
                // 新增
                const { error } = await db.from('schedule_items').insert({
                    trip_id: TRIP_ID,
                    date: currentDateStr,
                    title,
                    time: time || null,
                    map_url: map_url || null,
                    notes: notes || null,
                    sort_order: 0
                });

                if (error) {
                    errEl.textContent = '新增失敗，請再試一次';
                    errEl.classList.remove('hidden');
                    btn.disabled = false;
                    btn.textContent = '儲存';
                    return;
                }
            }

            btn.disabled = false;
            btn.textContent = '儲存';
            closeScheduleSheet();

            // 清 cache 並重新抓資料，依時間排序重渲染
            cache.schedule = null;
            await renderSchedule();
        }

                                onclick="event.stopPropagation(); openTransportSheet('${detail.id}', '${group.type}')">

                                    <div class="text-[11px] text-slate-500 font-bold">還：<span class="text-cyan-600 font-black tracking-tight">${detail.return_date ? formatDate(detail.return_date) : ''}${detail.return_time ? ' ' + formatTime(detail.return_time) : ''}</span></div>

                    return '';
                }).join('');
                return `
                    <div class="bg-white rounded-[2rem] border border-slate-100 shadow-sm mb-4 overflow-hidden">
                        <div class="relative flex items-center justify-center py-7 px-6 cursor-pointer active:bg-slate-50 transition-all"
                            onclick="this.closest('.bg-white').classList.toggle('expanded')">
                            <div class="absolute left-6 p-3 bg-cyan-50 text-cyan-600 rounded-2xl flex items-center justify-center">
                                <i data-lucide="${meta.icon}" class="w-6 h-6"></i>
                            </div>
                            <h3 class="font-black text-slate-800 text-lg">${meta.name}</h3>
                            <div class="absolute right-6 text-slate-300">
                                <i data-lucide="chevron-down" class="w-5 h-5 transition-transform duration-300 expand-chevron"></i>
                            </div>
                        </div>
                        <div class="expand-content">
                            <div class="px-6 pb-4">
                                <div class="border-t border-slate-100 pt-4 mb-3">${detailsHtml}</div>
                                <div class="flex gap-2">
                                    <button onclick="event.stopPropagation(); openTransportSheet(null, '${group.type}')"
                                        class="flex-1 bg-cyan-50 text-cyan-600 py-3 rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-all">
                                        <i data-lucide="plus" class="w-4 h-4"></i>
                                        <span class="text-xs font-bold">新增明細</span>
                                    </button>
                                    <button onclick="event.stopPropagation(); openDeleteModal(() => deleteTransportGroup('${group.id}'))"

            }).join('') : emptyHtml;
            container.innerHTML = `<div class="space-y-2 pb-20">${getPageHeader("交通方式", "Transit & Logistics", transportHeaderActions)}${itemsHtml}</div>`;
            lucide.createIcons();
        }

        // ============================================
        // 交通 CRUD
        // ============================================
        let transportEditId  = null;   // detail id（null = 新增）
        let transportGroupId = null;   // 編輯時記住所屬 group id
        let transportType    = 'train';

        // 每種類型顯示哪些欄位群組
        const TRANSPORT_FIELD_MAP = {
            train:  ['date', 'vehicle-sub', 'vehicle-no', 'locations', 'times', 'seat', 'booking'],
            hsr:    ['date', 'vehicle-sub', 'vehicle-no', 'locations', 'times', 'seat', 'booking'],
            bus:    ['date', 'operator-bus', 'vehicle-no', 'locations', 'times', 'seat', 'booking'],
            flight: ['date', 'flight-info', 'vehicle-no', 'locations', 'times', 'seat', 'booking', 'notes'],
            taxi:   ['date', 'locations', 'times', 'taxi-platform'],
            rental: ['rental-dates', 'rental-store', 'rental-contact'],
        };

        // vehicle-no 的 label 依類型不同
        const VEHICLE_NO_LABELS = {
            train: '車次號碼 <span class="text-red-400">*</span>',
            hsr:   '車次號碼 <span class="text-red-400">*</span>',
            bus:   '車次號碼',
            flight:'班機號碼 <span class="text-red-400">*</span>',
        };

        // from/to label 依類型不同
        const LOCATION_LABELS = {
            flight: ['出發機場', '抵達機場'],
            taxi:   ['出發地', '目的地'],
        };

        const ALL_TRANSPORT_FIELDS = ['date','rental-dates','operator-bus','flight-info','vehicle-sub','vehicle-no','locations','times','rental-store','seat','taxi-platform','booking','rental-contact','notes'];

        function setTransportType(type) {
            transportType = type;
            const show = TRANSPORT_FIELD_MAP[type] || [];
            ALL_TRANSPORT_FIELDS.forEach(f => {
                const el = document.getElementById(`t-field-${f}`);
                if (el) el.classList.toggle('hidden', !show.includes(f));
            });
            // 更新 vehicle-no label
            const vnLabel = document.getElementById('t-vehicle-no-label');
            if (vnLabel) vnLabel.innerHTML = VEHICLE_NO_LABELS[type] || '號碼';
            // 更新 from/to label
            const [fromLabel, toLabel] = LOCATION_LABELS[type] || ['出發站 <span class="text-red-400">*</span>', '抵達站 <span class="text-red-400">*</span>'];
            const fromEl = document.getElementById('t-from-label');
            const toEl   = document.getElementById('t-to-label');
            if (fromEl) fromEl.innerHTML = fromLabel;
            if (toEl)   toEl.innerHTML   = toLabel;
            // 類型按鈕樣式
            Object.keys(TRANSPORT_META).forEach(k => {
                const btn = document.getElementById(`t-type-btn-${k}`);
                if (!btn) return;
                btn.className = `py-2.5 rounded-2xl text-xs font-bold border transition-all ${
                    k === type ? 'border-cyan-400 bg-cyan-50 text-cyan-600'
                               : 'border-slate-200 bg-slate-50 text-slate-500'}`;
            });
        }

        function openTransportSheet(detailId, groupType) {
            transportEditId = detailId;
            // 決定預設類型
            const initType = groupType || 'train';
            document.getElementById('transport-sheet-title').textContent = detailId ? '編輯交通' : '新增交通';
            document.getElementById('transport-sheet-error').classList.add('hidden');
            document.getElementById('transport-delete-btn').classList.toggle('hidden', !detailId);
            // 清空所有欄位
            ['t-date','t-rental-date','t-rental-time','t-return-date','t-return-time',
             't-operator-bus','t-operator-flight','t-platform','t-vehicle-sub','t-vehicle-no',
             't-from','t-to','t-depart','t-arrive','t-rental-store','t-seat',
             't-taxi-platform','t-booking-url','t-store-map-url','t-phone','t-notes'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = '';
            });
            // 填入編輯資料
            if (detailId) {
                // 從 cache 找出這筆 detail
                let found = null, foundGroup = null;
                (cache.transport || []).forEach(g => {
                    const d = (g.transport_details || []).find(x => x.id === detailId);
                    if (d) { found = d; foundGroup = g; }
                });
                if (found && foundGroup) {
                    transportGroupId = foundGroup.id;
                    const type = foundGroup.type;
                    setTransportType(type);
                    // 類型按鈕鎖定（編輯時不允許切換類型）
                    Object.keys(TRANSPORT_META).forEach(k => {
                        const btn = document.getElementById(`t-type-btn-${k}`);
                        if (btn) btn.disabled = (k !== type);
                    });
                    if (type === 'rental') {
                        document.getElementById('t-rental-date').value  = found.date        || '';
                        document.getElementById('t-rental-time').value  = found.depart_time ? found.depart_time.slice(0,5) : '';
                        document.getElementById('t-return-date').value  = found.return_date || '';
                        document.getElementById('t-return-time').value  = found.return_time ? found.return_time.slice(0,5) : '';
                        document.getElementById('t-rental-store').value = found.from_location || '';
                        document.getElementById('t-store-map-url').value= found.store_map_url || '';
                        document.getElementById('t-phone').value        = found.phone || '';
                    } else {
                        document.getElementById('t-date').value    = found.date || '';
                        document.getElementById('t-from').value    = found.from_location || '';
                        document.getElementById('t-to').value      = found.to_location   || '';
                        document.getElementById('t-depart').value  = found.depart_time ? found.depart_time.slice(0,5) : '';
                        document.getElementById('t-arrive').value  = found.arrive_time ? found.arrive_time.slice(0,5) : '';
                        document.getElementById('t-vehicle-no').value  = found.vehicle_no  || '';
                        document.getElementById('t-vehicle-sub').value = found.vehicle_sub || '';
                        document.getElementById('t-seat').value        = found.seat_info   || '';
                        document.getElementById('t-booking-url').value = found.booking_url || '';
                        document.getElementById('t-notes').value       = found.notes       || '';
                        if (type === 'bus') {
                            document.getElementById('t-operator-bus').value = found.operator || '';
                        }
                        if (type === 'flight') {
                            document.getElementById('t-operator-flight').value = found.operator || '';
                            document.getElementById('t-platform').value        = found.platform  || '';
                        }
                        if (type === 'taxi') {
                            document.getElementById('t-taxi-platform').value = found.platform || '';
                        }
                    }
                }
            } else {
                transportGroupId = null;
                setTransportType(initType);
                // 新增時開放所有類型按鈕
                Object.keys(TRANSPORT_META).forEach(k => {
                    const btn = document.getElementById(`t-type-btn-${k}`);
                    if (btn) btn.disabled = false;
                });
            }
            document.getElementById('transport-sheet-overlay').classList.add('show');
            document.getElementById('transport-sheet').classList.add('show');
            setTimeout(() => {
                const firstInput = document.querySelector('#transport-sheet input:not([disabled])');
                if (firstInput) firstInput.focus();
            }, 350);
        }

        function closeTransportSheet() {
            document.getElementById('transport-sheet-overlay').classList.remove('show');
            document.getElementById('transport-sheet').classList.remove('show');
        }

        async function submitTransport() {
            const errEl = document.getElementById('transport-sheet-error');
            errEl.classList.add('hidden');
            const btn = document.getElementById('transport-submit-btn');

            // 收集欄位
            let payload = {};
            let validationError = null;

            if (transportType === 'rental') {
                const rentalDate  = document.getElementById('t-rental-date').value;
                const returnDate  = document.getElementById('t-return-date').value;
                const storeName   = document.getElementById('t-rental-store').value.trim();
                if (!rentalDate)  validationError = '請選擇租車日期';
                else if (!returnDate) validationError = '請選擇還車日期';
                else if (!storeName)  validationError = '請輸入店家名稱';
                else {
                    payload = {
                        date:          rentalDate,
                        depart_time:   document.getElementById('t-rental-time').value  || null,
                        return_date:   returnDate,
                        return_time:   document.getElementById('t-return-time').value  || null,
                        from_location: storeName,
                        store_map_url: document.getElementById('t-store-map-url').value.trim() || null,
                        phone:         document.getElementById('t-phone').value.trim()         || null,
                    };
                }
            } else {
                const date       = document.getElementById('t-date').value;
                const fromLoc    = document.getElementById('t-from').value.trim();
                const vehicleNo  = document.getElementById('t-vehicle-no').value.trim();
                const operatorBus= transportType === 'bus'    ? document.getElementById('t-operator-bus').value.trim()    : null;
                const operatorFlt= transportType === 'flight' ? document.getElementById('t-operator-flight').value.trim() : null;

                if (!date) validationError = '請選擇日期';
                else if (transportType === 'bus'    && !operatorBus) validationError = '請輸入客運業者名稱';
                else if (transportType === 'flight' && !operatorFlt) validationError = '請輸入航空公司';
                else if ((transportType === 'train' || transportType === 'hsr' || transportType === 'flight') && !vehicleNo)
                    validationError = transportType === 'flight' ? '請輸入班機號碼' : '請輸入車次號碼';
                else if ((transportType !== 'taxi') && !fromLoc) validationError = '請輸入出發站';
                else {
                    payload = {
                        date,
                        from_location: fromLoc || null,
                        to_location:   document.getElementById('t-to').value.trim()     || null,
                        depart_time:   document.getElementById('t-depart').value        || null,
                        arrive_time:   document.getElementById('t-arrive').value        || null,
                        vehicle_no:    vehicleNo || null,
                        vehicle_sub:   document.getElementById('t-vehicle-sub').value.trim() || null,
                        seat_info:     document.getElementById('t-seat').value.trim()        || null,
                        booking_url:   document.getElementById('t-booking-url').value.trim() || null,
                        notes:         document.getElementById('t-notes') ? document.getElementById('t-notes').value.trim() || null : null,
                        operator:      operatorBus || operatorFlt || null,
                        platform:      (transportType === 'flight')
                                           ? document.getElementById('t-platform').value.trim() || null
                                           : (transportType === 'taxi')
                                               ? document.getElementById('t-taxi-platform').value.trim() || null
                                               : null,
                    };
                }
            }

            if (validationError) {
                errEl.textContent = validationError;
                errEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true; btn.textContent = '儲存中...';

            if (transportEditId) {
                // 編輯：直接 update detail
                const { error } = await db.from('transport_details').update(payload).eq('id', transportEditId);
                btn.disabled = false; btn.textContent = '儲存';
                if (error) { errEl.textContent = '儲存失敗，請再試一次'; errEl.classList.remove('hidden'); return; }
            } else {
                // 新增：找或建 group
                let groupId = transportGroupId;
                if (!groupId) {
                    // 先找現有同 type 的 group
                    const existing = (cache.transport || []).find(g => g.type === transportType);
                    if (existing) {
                        groupId = existing.id;
                    } else {
                        // 建新 group
                        const { data: newGroup, error: gErr } = await db
                            .from('transport_groups')
                            .insert({ trip_id: TRIP_ID, type: transportType })
                            .select()
                            .single();
                        if (gErr) {
                            btn.disabled = false; btn.textContent = '儲存';
                            errEl.textContent = '儲存失敗，請再試一次'; errEl.classList.remove('hidden'); return;
                        }
                        groupId = newGroup.id;
                    }
                }
                const { error } = await db.from('transport_details').insert({ group_id: groupId, ...payload });
                btn.disabled = false; btn.textContent = '儲存';
                if (error) { errEl.textContent = '儲存失敗，請再試一次'; errEl.classList.remove('hidden'); return; }
            }

            closeTransportSheet();
            cache.transport = null;
            await renderTransport();
        }

        async function deleteTransportDetail() {
            if (!transportEditId) return;
            // 找出所屬 group
            let foundGroup = null;
            (cache.transport || []).forEach(g => {
                if ((g.transport_details || []).find(d => d.id === transportEditId)) foundGroup = g;
            });
            await db.from('transport_details').delete().eq('id', transportEditId);
            // 若 group 底下已無其他 detail，自動刪 group
            if (foundGroup) {
                const remaining = (foundGroup.transport_details || []).filter(d => d.id !== transportEditId);
                if (remaining.length === 0) {
                    await db.from('transport_groups').delete().eq('id', foundGroup.id);
                }
            }
            closeTransportSheet();
            cache.transport = null;
            await renderTransport();
        }

        async function deleteTransportGroup(groupId) {
            await db.from('transport_groups').delete().eq('id', groupId);
            cache.transport = null;
            await renderTransport();
        }

        // ============================================
        // 美食
        // ============================================
        async function renderFood() {
            showLoading();
            const container = document.getElementById('app-content');
            if (!cache.restaurants) {
                const { data, error } = await db.from('restaurants').select('*').eq('trip_id', TRIP_ID).order('created_at', { ascending: true });
                if (error) { showError('無法載入美食清單'); return; }
                cache.restaurants = data;
            }
            const items = cache.restaurants.filter(r => r.category === currentFoodCat);
            const foodHeaderActions = `
                <button onclick="openFoodSheet(null)" class="p-2 bg-amber-500 rounded-xl text-white shadow-md shadow-amber-200 active:scale-95 transition-all">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                </button>`;
            const catEmoji = currentFoodCat === '正餐' ? '🍽️' : '🍰';
            const emptyHtml = `
                <div class="flex flex-col items-center justify-center py-16 text-center">
                    <div class="text-4xl mb-3">${catEmoji}</div>
                    <p class="text-slate-400 font-bold text-sm">還沒有${currentFoodCat}紀錄</p>
                    <p class="text-slate-300 text-xs mt-1">點右上角 + 新增第一筆</p>
                </div>`;
            const itemsHtml = items.length ? items.map(f => `
                <div class="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center cursor-pointer active:scale-[0.98] transition-all"
                    onclick="openFoodSheet('${f.id}')">
                    <div class="flex flex-col flex-1 min-w-0 mr-3">
                        <h3 class="font-bold text-slate-800 text-sm truncate">${f.name}</h3>
                        ${f.description ? `<p class="text-[10px] text-slate-400 mt-1 leading-tight">${f.description}</p>` : ''}
                    </div>
                    ${f.map_url ? `<button onclick="event.stopPropagation(); window.open('${f.map_url}', '_blank')" class="bg-cyan-600 text-white p-3 rounded-2xl shadow-lg active:scale-95 flex-none transition-all"><i data-lucide="map-pin" class="w-4 h-4"></i></button>` : ''}
                </div>`).join('') : emptyHtml;
            container.innerHTML = `
                <div class="space-y-4 pb-20">
                    ${getPageHeader("美食清單", "Foodie Guide", foodHeaderActions)}
                    <div class="flex bg-slate-200 p-1 rounded-2xl">
                        <button onclick="setFoodCat('正餐')" class="flex-1 py-2 text-xs font-bold rounded-xl ${currentFoodCat === '正餐' ? 'active-food-tab shadow-sm' : 'text-slate-500'}">🍽️ 正餐</button>
                        <button onclick="setFoodCat('點心')" class="flex-1 py-2 text-xs font-bold rounded-xl ${currentFoodCat === '點心' ? 'active-food-tab shadow-sm' : 'text-slate-500'}">🍰 點心</button>
                    </div>
                    <div class="space-y-3">${itemsHtml}</div>
                </div>`;
            lucide.createIcons();
        }

        function setFoodCat(cat) { currentFoodCat = cat; cache.restaurants = null; renderFood(); }

        // ============================================
        // 美食 CRUD
        // ============================================
        let foodEditId = null;
        let foodCategory = '正餐';

        function setFoodCategory(cat) {
            foodCategory = cat;
            ['正餐', '點心'].forEach(c => {
                const btn = document.getElementById(`food-cat-btn-${c}`);
                if (!btn) return;
                btn.className = `flex-1 py-2.5 rounded-2xl text-xs font-bold border transition-all ${
                    c === cat ? 'border-cyan-400 bg-cyan-50 text-cyan-600'
                              : 'border-slate-200 bg-slate-50 text-slate-500'}`;
            });
        }

        function openFoodSheet(editId) {
            foodEditId = editId;
            document.getElementById('food-sheet-title').textContent = editId ? '編輯美食' : '新增美食';
            document.getElementById('food-name').value    = '';
            document.getElementById('food-desc').value    = '';
            document.getElementById('food-map-url').value = '';
            document.getElementById('food-sheet-error').classList.add('hidden');
            document.getElementById('food-delete-btn').classList.toggle('hidden', !editId);

            const defaultCat = editId ? '正餐' : currentFoodCat;

        // 呼叫 Places API (New) Autocomplete REST endpoint
        async function fetchPlaceSuggestions(query, includedTypes) {
            const body = { input: query, languageCode: 'zh-TW' };
            if (includedTypes?.length) body.includedPrimaryTypes = includedTypes;
            const res = await fetch('https://places.googleapis.com/v1/places:autocomplete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Goog-Api-Key': GPLACES_API_KEY },
                body: JSON.stringify(body),
            });
            if (!res.ok) return null;
            return await res.json();
        }

        // 每個搜尋欄的執行時狀態（selectedPlaceId、debounce timer）
        const _placeSearchState = {};

        /**
         * 初始化指定欄位的地點搜尋功能。
         * @param {string} prefix  - HTML id 前綴，例如 'sched' / 'hotel' / 'food' / 'attr'
         * @param {object} opts
         *   opts.nameInputId  - 名稱輸入欄 id（預設 `${prefix}-name`）
         *   opts.mapInputId   - 地圖連結欄 id（預設 `${prefix}-map-url`）
         *   opts.maxLength    - 名稱截斷長度（預設 20）
         *   opts.accentColor  - hover 顏色 class 前綴，例如 'emerald' / 'cyan'（預設 'cyan'）
         *   opts.iconColor    - 建議 icon 顏色 class（預設 accentColor）
         *   opts.includedTypes - Places API primaryType 過濾陣列
         */
        function initPlaceSearch(prefix, opts = {}) {
            const nameInputId = opts.nameInputId  || `${prefix}-name`;
            const mapInputId  = opts.mapInputId   || `${prefix}-map-url`;
            const maxLen      = opts.maxLength    || 20;
            const accent      = opts.accentColor  || 'cyan';
            const icon        = opts.iconColor    || accent;
            const types       = opts.includedTypes || [];

            const nameInput   = document.getElementById(nameInputId);
            if (!nameInput || nameInput._placeSearchInit) return;
            nameInput._placeSearchInit = true;

            if (!_placeSearchState[prefix]) _placeSearchState[prefix] = { selectedPlaceId: null, timer: null };
            const state = _placeSearchState[prefix];

            nameInput.addEventListener('input', () => {
                const val = nameInput.value;
                if (!val) {
                    state.selectedPlaceId = null;
                    document.getElementById(`${prefix}-name-clear`)?.classList.add('hidden');
                    document.getElementById(`${prefix}-place-preview`)?.classList.add('hidden');
                    document.getElementById(`${prefix}-map-indicator`)?.classList.add('hidden');
                    document.getElementById(`${prefix}-suggestions`)?.classList.add('hidden');
                    return;
                }
                document.getElementById(`${prefix}-name-clear`)?.classList.remove('hidden');
                if (state.selectedPlaceId) return;
                if (val.trim().length < 2) { document.getElementById(`${prefix}-suggestions`)?.classList.add('hidden'); return; }
                clearTimeout(state.timer);
                state.timer = setTimeout(() => _searchPlaces(prefix, val, maxLen, accent, icon, types), 500);
            });

            nameInput.addEventListener('blur', () => {
                setTimeout(() => document.getElementById(`${prefix}-suggestions`)?.classList.add('hidden'), 200);
            });
        }

        async function _searchPlaces(prefix, query, maxLen, accent, icon, types) {
            const suggestEl = document.getElementById(`${prefix}-suggestions`);
            const listEl    = document.getElementById(`${prefix}-suggestions-list`);
            if (!suggestEl || !listEl) return;

            const data = await fetchPlaceSuggestions(query, types);
            const suggestions = data?.suggestions;
            if (!suggestions?.length) { suggestEl.classList.add('hidden'); return; }

            listEl.innerHTML = suggestions.slice(0, 5).map((s, i) => {
                const p        = s.placePrediction;
                const placeId  = p?.placeId || '';
                const mainText = p?.structuredFormat?.mainText?.text || p?.text?.text || '';
                const secText  = p?.structuredFormat?.secondaryText?.text || '';
                const safeName = mainText.replace(/'/g, "\\'");
                return `
                <button type="button" onclick="selectPlace('${prefix}', '${placeId}', '${safeName}', ${maxLen})"
                    class="w-full text-left flex items-center gap-3 px-4 py-3 hover:bg-${accent}-50 active:bg-${accent}-100 transition-colors ${i > 0 ? 'border-t border-slate-50' : ''}">
                    <span class="w-8 h-8 rounded-xl bg-${icon}-100 flex items-center justify-center flex-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-${icon}-600" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                    </span>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-bold text-slate-800 truncate">${mainText}</p>
                        ${secText ? `<p class="text-[10px] text-slate-400 truncate mt-0.5">${secText}</p>` : ''}
                    </div>
                </button>`;
            }).join('');
            suggestEl.classList.remove('hidden');
        }

        // 選取建議後帶入名稱與 Maps 連結
        function selectPlace(prefix, placeId, name, maxLen) {
            const state = _placeSearchState[prefix];
            if (state) state.selectedPlaceId = placeId;
            const truncatedName = name.slice(0, maxLen || 20);

            const nameInputId = `${prefix}-name`;
            const mapInputId  = `${prefix}-map-url`;

            document.getElementById(nameInputId).value = truncatedName;
            document.getElementById(`${prefix}-suggestions`)?.classList.add('hidden');
            document.getElementById(`${prefix}-name-clear`)?.classList.add('hidden');

            const mapsUrl = `https://www.google.com/maps/search/?api=1&query_place_id=${placeId}&query=${encodeURIComponent(truncatedName)}`;
            const mapInput = document.getElementById(mapInputId);
            if (mapInput) {
                mapInput.value = mapsUrl;
                mapInput.setAttribute('readonly', true);
            }
            document.getElementById(`${prefix}-map-indicator`)?.classList.remove('hidden');
            const previewName = document.getElementById(`${prefix}-place-preview-name`);
            if (previewName) previewName.textContent = truncatedName;
            document.getElementById(`${prefix}-place-preview`)?.classList.remove('hidden');
        }

        // 清除搜尋狀態（通用，供各 Tab 的清除按鈕呼叫）
        function clearPlaceSearch(prefix) {
            const state = _placeSearchState[prefix];
            if (state) { state.selectedPlaceId = null; clearTimeout(state.timer); }
            const nameInputId = `${prefix}-name`;
            const mapInputId  = `${prefix}-map-url`;
            document.getElementById(nameInputId).value = '';
            const mapInput = document.getElementById(mapInputId);
            if (mapInput) { mapInput.value = ''; mapInput.removeAttribute('readonly'); }
            document.getElementById(`${prefix}-name-clear`)?.classList.add('hidden');
            document.getElementById(`${prefix}-place-preview`)?.classList.add('hidden');
            document.getElementById(`${prefix}-map-indicator`)?.classList.add('hidden');
            document.getElementById(`${prefix}-suggestions`)?.classList.add('hidden');
            document.getElementById(nameInputId).focus();
        }

        // 開啟 Sheet 時重置搜尋狀態的輔助函式
        function resetPlaceSearch(prefix, nameVal, mapVal) {
            if (!_placeSearchState[prefix]) _placeSearchState[prefix] = { selectedPlaceId: null, timer: null };
            const state = _placeSearchState[prefix];
            clearTimeout(state.timer);

            const mapInput = document.getElementById(`${prefix}-map-url`);
            if (nameVal) {
                // 編輯模式：已有資料，呈現預覽狀態
                state.selectedPlaceId = '__existing__';
                document.getElementById(`${prefix}-name-clear`)?.classList.remove('hidden');
                if (mapVal && mapInput) {
                    mapInput.setAttribute('readonly', true);
                    document.getElementById(`${prefix}-map-indicator`)?.classList.remove('hidden');
                    const previewName = document.getElementById(`${prefix}-place-preview-name`);
                    if (previewName) previewName.textContent = nameVal;
                    document.getElementById(`${prefix}-place-preview`)?.classList.remove('hidden');
                } else {
                    document.getElementById(`${prefix}-map-indicator`)?.classList.add('hidden');
                    document.getElementById(`${prefix}-place-preview`)?.classList.add('hidden');
                    if (mapInput) mapInput.removeAttribute('readonly');
                }
            } else {
                // 新增模式：全部重置
                state.selectedPlaceId = null;
                document.getElementById(`${prefix}-name-clear`)?.classList.add('hidden');
                document.getElementById(`${prefix}-place-preview`)?.classList.add('hidden');
                document.getElementById(`${prefix}-map-indicator`)?.classList.add('hidden');
                if (mapInput) mapInput.removeAttribute('readonly');
            }
            document.getElementById(`${prefix}-suggestions`)?.classList.add('hidden');
        }
